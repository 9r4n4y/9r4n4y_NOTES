<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>目覚め — The Waking of the Old Guardian</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',Georgia,serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;background:#000}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#1d2d30 0%,#0a1114 70%);color:#efe6c8;z-index:5;transition:opacity 1.6s}
  #ui h1{font-weight:400;letter-spacing:.5em;font-size:clamp(28px,5vw,64px);margin:0 0 .2em .5em}
  #ui p{letter-spacing:.25em;opacity:.7;font-size:clamp(11px,1.3vw,15px);margin:.3em 0}
  #go{margin-top:2.2em;padding:.9em 2.6em;border:1px solid rgba(239,230,200,.55);background:rgba(239,230,200,.06);color:#efe6c8;letter-spacing:.35em;font-family:inherit;font-size:14px;cursor:pointer;transition:all .4s;display:none}
  #go:hover{background:rgba(239,230,200,.18);letter-spacing:.45em}
  #bar{width:220px;height:2px;background:rgba(239,230,200,.15);margin-top:2em}
  #bar i{display:block;height:100%;width:0;background:#efe6c8;transition:width .3s}
  #hint{position:fixed;bottom:10px;right:14px;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.35);z-index:4}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="ui">
  <h1>目覚め</h1>
  <p>THE WAKING OF THE OLD GUARDIAN</p>
  <p id="msg">painting the forest…</p>
  <div id="bar"><i id="barfill"></i></div>
  <button id="go">BEGIN</button>
</div>
<div id="hint">M — sound &nbsp; R — replay</div>

<script>
'use strict';
/* =====================================================================
   A hand-painted anime sequence, procedurally "painted" with gouache dabs,
   cel-shaded mecha, stepped (on-twos) animation, multiplane camera.
   ===================================================================== */
const VW=1600,VH=672,WW=2800,WH=1400,GY=1190,RS=1.2,WCX=1400,WCY=700;
const LD={x:.62,y:-.78};            // direction TOWARD the sun (upper right)
const cv=document.getElementById('cv');cv.width=Math.round(VW*RS);cv.height=Math.round(VH*RS);
const ctx=cv.getContext('2d');
function fit(){const k=Math.min(innerWidth/VW,innerHeight/VH);cv.style.width=(VW*k)+'px';cv.style.height=(VH*k)+'px';}
addEventListener('resize',fit);fit();

/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry(7);
const rnd=(a=1,b)=>b===undefined?R()*a:a+R()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const H=(h,s,l,a=1)=>`hsla(${h.toFixed(1)},${clamp(s,0,100).toFixed(1)}%,${clamp(l,0,100).toFixed(1)}%,${a})`;
const J=(P,d=5,a=1)=>H(P[0]+rnd(-d,d),P[1]+rnd(-d,d),P[2]+rnd(-d,d)*.9,a);

/* ---------- blob library (hand wobbly shapes) ---------- */
const BLOBS=[];
(function(){const r=mulberry(99);for(let k=0;k<48;k++){const n=8+(k%3);const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const m=1+(r()-.5)*.6;pts.push([Math.cos(a)*m,Math.sin(a)*m]);}
 const p=new Path2D();const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];const s=mid(pts[n-1],pts[0]);p.moveTo(s[0],s[1]);
 for(let i=0;i<n;i++){const q=mid(pts[i],pts[(i+1)%n]);p.quadraticCurveTo(pts[i][0],pts[i][1],q[0],q[1]);}p.closePath();BLOBS.push(p);}})();
function blob(g,x,y,rx,ry,rot,k){g.save();g.translate(x,y);g.rotate(rot||0);g.scale(rx,ry);g.fill(BLOBS[(k===undefined?(R()*48)|0:k)%48]);g.restore();}
function dab(g,x,y,r,col){g.fillStyle=col;for(let k=0;k<3;k++){const a=rnd(6.283),d=r*.45*rnd();blob(g,x+Math.cos(a)*d,y+Math.sin(a)*d*.8,r*rnd(.55,.85),r*rnd(.42,.72),rnd(3.14));}}

function foliage(g,cx,cy,rx,ry,P,n,sz=1,ld=LD){
  const pts=[];for(let i=0;i<n;i++){const a=rnd(6.283),d=Math.sqrt(rnd());pts.push([cx+Math.cos(a)*d*rx,cy+Math.sin(a)*d*ry,d,a]);}
  const U=p=>(Math.cos(p[3])*ld.x+Math.sin(p[3])*ld.y)*p[2];
  for(const p of pts)dab(g,p[0],p[1],(15+rnd(20))*sz,J(P.d,5));
  for(const p of pts)if(U(p)>-.4&&rnd()<.85)dab(g,p[0]+ld.x*6*sz,p[1]+ld.y*6*sz,(10+rnd(15))*sz,J(P.m,5));
  for(const p of pts)if(U(p)>0&&rnd()<.75)dab(g,p[0]+ld.x*11*sz,p[1]+ld.y*11*sz,(6+rnd(10))*sz,J(P.l,5));
  for(const p of pts)if(U(p)>.3&&rnd()<.5)dab(g,p[0]+ld.x*15*sz,p[1]+ld.y*15*sz,(3+rnd(6))*sz,J(P.hi,5));
}

/* ---------- layers ---------- */
function mkLayer(w,h,s,y0){const c=document.createElement('canvas');c.width=Math.ceil(w*s);c.height=Math.ceil(h*s);const g=c.getContext('2d');g.scale(s,s);g.translate(0,-y0);return{c,g,s,y0,w,h};}
const LAY={
  sky:mkLayer(WW,3200,.45,-1800), far:mkLayer(WW,WH,.8,0), mid:mkLayer(WW,WH,.9,0), cMid:mkLayer(WW,1700,.7,-1100),
  near:mkLayer(WW,WH,1,0), cNear:mkLayer(WW,1700,.75,-1100), ground:mkLayer(WW,WH,1,0), fg:mkLayer(WW,WH,1,0)
};

function brushTex(L,n,y0,y1,warm){
  const g=L.g;g.save();g.globalCompositeOperation='source-atop';g.lineCap='round';
  for(let i=0;i<n;i++){const x=rnd(WW),y=rnd(y0,y1),len=30+rnd(110),ang=-1.35+rnd(.9);
    const light=rnd()<.5;g.strokeStyle=light?H(rnd(45,95),55,82,.035+rnd(.05)):H(rnd(190,250),40,24,.03+rnd(.05));
    g.lineWidth=3+rnd(9);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(ang)*len*.5+rnd(-8,8),y+Math.sin(ang)*len*.5,x+Math.cos(ang)*len,y+Math.sin(ang)*len);g.stroke();}
  g.restore();
}
function haze(L,col,a,y0,y1){const g=L.g;g.save();g.globalCompositeOperation='source-atop';const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,`rgba(${col},${a*.4})`);gr.addColorStop(1,`rgba(${col},${a})`);g.fillStyle=gr;g.fillRect(0,y0,WW,y1-y0);g.restore();}
function warmGlow(L,x,y,r,a){const g=L.g;g.save();g.globalCompositeOperation='source-atop';const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(255,214,130,${a})`);gr.addColorStop(1,'rgba(255,214,130,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore();}

/* ---------- SKY ---------- */
function cloud(g,x,y,w,h,warm){
  const n=Math.floor(w/26)+4,pf=[];
  for(let i=0;i<n;i++){const t=i/(n-1),dome=Math.sin(t*Math.PI),r=h*(.3+.5*dome)*rnd(.7,1.2);pf.push([x+(t-.5)*w,y-dome*h*.3+rnd(-5,5),r]);}
  g.fillStyle=H(warm?340:255,warm?42:30,warm?80:82);for(const p of pf)blob(g,p[0],p[1]+p[2]*.18,p[2]*1.18,p[2]*.95,rnd(3));
  g.fillStyle=H(warm?32:195,warm?70:45,warm?93:96);for(const p of pf)blob(g,p[0]+p[2]*.12,p[1]-p[2]*.12,p[2]*.92,p[2]*.78,rnd(3));
  g.fillStyle=H(warm?42:50,warm?95:85,warm?88:98);for(const p of pf)if(rnd()<.75)blob(g,p[0]+p[2]*.3,p[1]-p[2]*.3,p[2]*.5,p[2]*.36,rnd(3));
}
function paintSky(L){
  const g=L.g;R=mulberry(3);
  const gr=g.createLinearGradient(0,-1800,0,1400);
  gr.addColorStop(0,H(214,52,50));gr.addColorStop(.3,H(202,50,66));gr.addColorStop(.5,H(192,44,80));gr.addColorStop(.6,H(46,62,87));gr.addColorStop(.72,H(40,88,80));gr.addColorStop(.82,H(35,96,72));gr.addColorStop(1,H(28,86,62));
  g.fillStyle=gr;g.fillRect(0,-1800,WW,3200);
  // sun glow
  let rg=g.createRadialGradient(2150,760,0,2150,760,1100);rg.addColorStop(0,'rgba(255,248,214,.95)');rg.addColorStop(.18,'rgba(255,226,150,.65)');rg.addColorStop(.5,'rgba(255,196,120,.22)');rg.addColorStop(1,'rgba(255,190,120,0)');
  g.fillStyle=rg;g.fillRect(0,-800,WW,2200);
  g.fillStyle=H(50,100,96);blob(g,2150,770,62,60,0,3);
  // painted clouds
  for(let i=0;i<26;i++){const y=rnd(-1500,720),x=rnd(-100,WW+100);const w=rnd(260,700)*(1+(y<0?.5:0));cloud(g,x,y,w,rnd(50,110),y>200||rnd()<.35);}
  // cirrus streaks
  for(let i=0;i<70;i++){const x=rnd(WW),y=rnd(-1700,600);g.fillStyle=H(rnd(15,50),70,rnd(86,95),.28);blob(g,x,y,rnd(120,380),rnd(4,12),rnd(-.25,.1));}
  // rays of warm light fanning from sun
  g.save();for(let i=0;i<12;i++){const a=-Math.PI*.62+i*.13;g.fillStyle=H(45,100,86,.05);g.beginPath();g.moveTo(2150,760);g.lineTo(2150+Math.cos(a-.03)*2400,760+Math.sin(a-.03)*2400);g.lineTo(2150+Math.cos(a+.03)*2400,760+Math.sin(a+.03)*2400);g.fill();}g.restore();
  brushTex(L,2500,-1800,1400);
}

/* ---------- FAR hazy ridges & cedars ---------- */
function cedar(g,x,by,h,w,P){
  const m=Math.max(4,Math.floor(h/24));
  for(let pass=0;pass<3;pass++)for(let j=0;j<m;j++){const t=j/m,y=by-h*t,ww=w*(1-t*.82)*rnd(.75,1.2)+4;
    g.fillStyle=J(pass==0?P.d:pass==1?P.m:P.l,3);const off=pass*ww*.14;
    blob(g,x+off+rnd(-3,3),y,ww*.95,h/m*.8,rnd(-.2,.2));}
  g.fillStyle=J(P.m,3);blob(g,x,by-h-8,w*.12+2,16,0);
}
function paintFar(L){
  const g=L.g;R=mulberry(11);
  const rows=[{y:690,c:[194,22,82],t:[192,22,76],n:30,hh:[170,300]},{y:790,c:[188,26,73],t:[186,27,67],n:38,hh:[180,340]},{y:890,c:[182,30,63],t:[180,31,56],n:44,hh:[210,400]}];
  rows.forEach((row,k)=>{
    const ridge=x=>row.y+Math.sin(x*.0037+k*1.9)*34+Math.sin(x*.0113+k*.7)*14+Math.sin(x*.0231+k)*5;
    const P={d:[row.t[0],row.t[1]+4,row.t[2]-8],m:row.t,l:[row.t[0]-14,row.t[1]+8,row.t[2]+8],hi:[58,50,row.t[2]+16]};
    for(let i=0;i<row.n;i++){const x=rnd(WW),h=rnd(row.hh[0],row.hh[1]);cedar(g,x,ridge(x)+14,h,h*rnd(.15,.24),P);}
    g.beginPath();g.moveTo(0,WH);for(let x=0;x<=WW;x+=14)g.lineTo(x,ridge(x));g.lineTo(WW,WH);g.closePath();g.fillStyle=H(row.c[0],row.c[1],row.c[2]);g.fill();
    for(let x=0;x<WW;x+=20)dab(g,x+rnd(-8,8),ridge(x)+rnd(-3,7),rnd(13,24),H(row.t[0],row.t[1],row.t[2]+rnd(-3,5)));
    const fg=g.createLinearGradient(0,row.y-110,0,row.y+160);fg.addColorStop(0,'rgba(238,238,222,0)');fg.addColorStop(1,`rgba(240,236,208,${.6+k*.07})`);g.fillStyle=fg;g.fillRect(0,row.y-110,WW,WH-row.y+110);
  });
  warmGlow(L,2150,820,900,.6);
  brushTex(L,1400,300,1200);
}

/* ---------- trunks ---------- */
function trunk(g,x,yb,yt,wb,wt,P,o={}){
  const N=26,Lf=[],Rt=[];
  for(let i=0;i<=N;i++){const t=i/N,y=lerp(yb,yt,t);const fl=t<.14?(1-t/.14)*(1-t/.14)*.7:0;const w=lerp(wb,wt,Math.pow(t,.85))*(1+fl);
    const cx=x+(o.lean||0)*t*Math.abs(yb-yt)+Math.sin(t*5+x)*w*.04;const wo=(rnd()-.5)*w*.05;Lf.push([cx-w/2+wo,y,w]);Rt.push([cx+w/2+wo*.8,y,w]);}
  const path=new Path2D();path.moveTo(Lf[0][0],Lf[0][1]);Lf.forEach(p=>path.lineTo(p[0],p[1]));for(let i=N;i>=0;i--)path.lineTo(Rt[i][0],Rt[i][1]);path.closePath();
  const at=(i,f)=>[Lf[i][0]+(Rt[i][0]-Lf[i][0])*f,Lf[i][1]];
  g.save();g.clip(path);g.fillStyle=H(P.b[0],P.b[1],P.b[2]);g.fillRect(x-wb*2,yt-10,wb*4,yb-yt+60);
  // cool shadow side
  g.fillStyle=H(P.s[0],P.s[1],P.s[2]);g.beginPath();for(let i=0;i<=N;i++){const a=at(i,0);i?g.lineTo(a[0],a[1]):g.moveTo(a[0],a[1]);}
  for(let i=N;i>=0;i--){const a=at(i,.38+Math.sin(i*.7+x)*.07);g.lineTo(a[0],a[1]);}g.fill();
  // warm lit side
  g.fillStyle=H(P.l[0],P.l[1],P.l[2]);g.beginPath();for(let i=0;i<=N;i++){const a=at(i,.8+Math.sin(i*.5+x*.1)*.05);i?g.lineTo(a[0],a[1]):g.moveTo(a[0],a[1]);}
  for(let i=N;i>=0;i--){const a=at(i,1.05);g.lineTo(a[0],a[1]);}g.fill();
  // bark strokes
  g.lineCap='round';const ns=Math.floor(wb/4);
  for(let k=0;k<ns;k++){const f=rnd(),y0=rnd(yt,yb),len=rnd(50,220);const i0=clamp(Math.round((yb-y0)/(yb-yt)*N),0,N);const a=at(i0,f);
    g.strokeStyle=f<.4?H(P.s[0],P.s[1],P.s[2]-8,.5):f>.7?H(P.l[0],P.l[1],P.l[2]+9,.45):H(P.b[0],P.b[1],P.b[2]-9,.45);g.lineWidth=rnd(1.2,3.4);
    g.beginPath();g.moveTo(a[0],y0);g.quadraticCurveTo(a[0]+rnd(-5,5),y0-len*.5,a[0]+rnd(-6,6),y0-len);g.stroke();}
  // moss on shadow side & base
  if(o.moss)for(let k=0;k<o.moss;k++){const t=Math.pow(rnd(),1.6)*.65,i=Math.round(t*N);const a=at(i,rnd(.0,.55));const r=rnd(10,26)*(wb/120+.5);
    g.fillStyle=H(145,40,22);blob(g,a[0],a[1],r*1.3,r*.9,rnd(3));g.fillStyle=H(112,46,34);blob(g,a[0]+r*.2,a[1]-r*.2,r,r*.7,rnd(3));g.fillStyle=H(84,60,50);blob(g,a[0]+r*.45,a[1]-r*.4,r*.5,r*.35,rnd(3));}
  g.restore();
  // roots
  g.lineCap='round';
  for(let k=0;k<(o.roots||3);k++){const s=k%2?1:-1,rx0=x+s*wb*rnd(.2,.4),len=wb*rnd(.6,1.1);
    g.strokeStyle=H(P.s[0],P.s[1],P.s[2]);g.lineWidth=wb*.2;g.beginPath();g.moveTo(rx0,yb-wb*.35);g.quadraticCurveTo(rx0+s*len*.5,yb-wb*.05,rx0+s*len,yb+8);g.stroke();
    g.strokeStyle=H(P.b[0],P.b[1],P.b[2]);g.lineWidth=wb*.12;g.beginPath();g.moveTo(rx0,yb-wb*.4);g.quadraticCurveTo(rx0+s*len*.5,yb-wb*.12,rx0+s*len,yb+4);g.stroke();}
}

/* ---------- MID ---------- */
function paintMid(L){
  const g=L.g;R=mulberry(23);
  const gg=g.createLinearGradient(0,800,0,WH);gg.addColorStop(0,H(180,26,60));gg.addColorStop(1,H(165,30,32));
  g.fillStyle=gg;g.beginPath();g.moveTo(0,WH);for(let x=0;x<=WW;x+=14)g.lineTo(x,900+Math.sin(x*.005)*30+Math.sin(x*.02)*8);g.lineTo(WW,WH);g.fill();
  const P={b:[176,24,36],s:[192,30,24],l:[110,28,50]};
  const xs=[80,260,470,690,900,1090,1730,1930,2130,2330,2530,2740];
  const PBm={d:[178,30,30],m:[165,32,38],l:[118,40,50],hi:[75,60,64]};
  xs.forEach((x,i)=>{x+=rnd(-40,40);const w=rnd(60,110),inGap=x>760&&x<2040,yt=inGap?rnd(500,680):-60;
    trunk(g,x,rnd(960,1010),yt,w,inGap?w*.5:w*.62,P,{lean:rnd(-.05,.05),moss:6,roots:3});
    if(inGap){foliage(g,x+rnd(-12,12),yt+14,w*1.7,w*1.05,PBm,60,1.3);foliage(g,x+rnd(-60,60),yt+60,w*1.2,w*.7,PBm,30,1.1);}});
  // understory bushes
  const PB={d:[178,34,26],m:[160,36,34],l:[112,42,46],hi:[72,60,62]};
  for(let x=0;x<WW;x+=70)foliage(g,x+rnd(-20,20),rnd(930,1000),rnd(60,100),rnd(40,70),PB,34,1);
  haze(L,'206,224,214',.36,300,1100);
  brushTex(L,1800,300,1100);
}
function paintCanopy(L,c){
  const g=L.g;R=mulberry(c.seed);
  const hw=y=>lerp(c.w0,c.w1,sstep(c.yb-30,-900,y));
  const yb=x=>c.yb+Math.sin(x*.006+c.seed)*42+Math.sin(x*.019)*18;
  const xl=y=>1400-hw(y)+Math.sin(y*.013+c.seed)*28,xr=y=>1400+hw(y)+Math.sin(y*.011+2)*28;
  g.fillStyle=H(c.dark[0],c.dark[1],c.dark[2]);
  g.beginPath();g.moveTo(-60,-1100);for(let y=-1100;y<=c.yb;y+=20)g.lineTo(xl(y),y);for(let x=xl(c.yb);x>=-60;x-=20)g.lineTo(x,yb(x));g.closePath();g.fill();
  g.beginPath();g.moveTo(WW+60,-1100);for(let y=-1100;y<=c.yb;y+=20)g.lineTo(xr(y),y);for(let x=xr(c.yb);x<=WW+60;x+=20)g.lineTo(x,yb(x));g.closePath();g.fill();
  const deep={d:c.dark,m:c.m0,l:c.l0,hi:c.h0},edge={d:c.m0,m:c.m1,l:c.l1,hi:c.h1};
  const inside=(x,y)=>x<xl(y)||x>xr(y);
  // interior masses
  for(let i=0;i<c.nInt;i++){const x=rnd(-50,WW+50),y=rnd(-1100,c.yb);if(!inside(x,y))continue;const d=Math.min(Math.abs(x-1400)-hw(y),c.yb-y);
    foliage(g,x,y,rnd(60,120),rnd(50,90),d<200?edge:deep,26,1.1,{x:.3,y:.8});}
  // edge masses along funnel and underside
  for(let y=-1100;y<=c.yb;y+=34){foliage(g,xl(y)-rnd(0,36),y,rnd(60,95),rnd(40,60),edge,34,1,{x:.7,y:.55});foliage(g,xr(y)+rnd(0,36),y,rnd(60,95),rnd(40,60),edge,34,1,{x:-.7,y:.55});}
  for(let x=-40;x<WW+40;x+=44){const d=Math.abs(x-1400)-hw(c.yb);if(d<-20)continue;foliage(g,x,yb(x)-rnd(5,50),rnd(55,90),rnd(40,58),edge,32,1,{x:.4,y:.85});}
  // translucent backlit glints
  for(let i=0;i<260;i++){const y=rnd(-900,c.yb),side=rnd()<.5?-1:1,x=1400+side*(hw(y)+rnd(-10,150));g.fillStyle=H(rnd(62,86),rnd(70,90),rnd(55,70),.8);blob(g,x,y,rnd(4,10),rnd(3,7),rnd(3));}
  if(c.limbs)c.limbs(g);
  brushTex(L,1500,-1100,c.yb);
}
function limb(g,p0,p1,p2,w0,w1,moss){

/* ---------- skeleton ---------- */
function fk(p,ox,oy){
  const roll=(p.roll||0)*D2R,t=p.tor*D2R+roll,h=p.hd*D2R+roll,F={};
  const tf=(a,x0,y0)=>{const d=[Math.sin(a),-Math.cos(a)],n=[Math.cos(a),Math.sin(a)];return(u,v)=>[x0+(d[0]*u+n[0]*v)*RB,y0+(d[1]*u+n[1]*v)*RB];};
  const lf=(a,x0,y0)=>{const d=[Math.sin(a),Math.cos(a)],n=[Math.cos(a),-Math.sin(a)];return(u,v)=>[x0+(d[0]*u+n[0]*v)*RB,y0+(d[1]*u+n[1]*v)*RB];};
  const T=tf(t,ox,oy);F.tor=T;const nk=T(196,14);F.head=tf(h,nk[0],nk[1]);
  const A=k=>p[k]*D2R-roll;
  const leg=(pre,hip)=>{const th=lf(A(pre+'Th'),hip[0],hip[1]);const kn=th(150,0);const sh=lf(A(pre+'Sh'),kn[0],kn[1]);const an=sh(150,0);F[pre+'Th']=th;F[pre+'Sh']=sh;F[pre+'Ft']=lf(A(pre+'Ft'),an[0],an[1]);return an;};
  const nA=leg('n',T(4,10));leg('f',T(0,-14));
  const arm=(pre,sh)=>{const ua=lf(A(pre+'UA'),sh[0],sh[1]);const el=ua(120,0);F[pre+'UA']=ua;F[pre+'FA']=lf(A(pre+'FA'),el[0],el[1]);};
  arm('n',T(168,4));arm('f',T(172,-30));
  return{F,nA,ox,oy,p};
}
function contacts(J){
  const pts=[];const add=(id)=>{const pt=PD[id],f=J.F[pt.fr];for(const q of pt.pts)pts.push(f(q[0],q[1]));};
  add('nFoot');add('fFoot');add('fSh');const k=J.F.fSh(0,0);pts.push([k[0],k[1]+30*RB]);return pts;
}
function groundSolve(p){const J0=fk(p,0,0);let my=-1e9;for(const q of contacts(J0))if(q[1]>my)my=q[1];return{ox:ANCH-J0.nA[0],oy:GY-my};}

function genMoss(pt,J){

  if(!cand.length)return;const tot=cand.reduce((s,c)=>s+c.w,0);const r=mulberry(pt.id.length*77+5);
  for(let k=0;k<pt.moss;k++){let x=r()*tot,c=cand[0];for(const cc of cand){x-=cc.w;if(x<=0){c=cc;break;}}const a=pt.pts[c.i],b=pt.pts[(c.i+1)%n],t=.1+r()*.8;
    pt.mossSpots.push({u:a[0]+(b[0]-a[0])*t+(pt.c[0]-a[0])*.04,v:a[1]+(b[1]-a[1])*t+(pt.c[1]-a[1])*.04,r:8+r()*9,th:r(),perm:r()<.35,flower:r()<.4,fc:(r()*4)|0,k:(r()*40)|0,gone:false});}
}

/* ---------- vines & saplings ---------- */

function stepVines(J){
  for(const vn of VINES){if(vn.dead)continue;const N=vn.nodes;
    if(vn.att){const a=J.F[PD[vn.part].fr](vn.u,vn.v);N[0].x=N[0].px=a[0];N[0].y=N[0].py=a[1];}
    for(let i=vn.att?1:0;i<vn.n;i++){const p=N[i];const vx=(p.x-p.px)*.93,vy=(p.y-p.py)*.93;p.px=p.x;p.py=p.y;p.x+=vx+WIND(p.x,p.y)*.22;p.y+=vy+2.3;}

function drawVines(lit){

    for(let i=2;i<vn.n;i+=2){const sd=(i/2)%2?1:-1,p=N[i],a=N[i-1];const ang=Math.atan2(p.y-a.y,p.x-a.x)+sd*1.1;const L=9*RB+3;
      ctx.fillStyle=INK;blob(ctx,p.x+Math.cos(ang)*L*.55,p.y+Math.sin(ang)*L*.55,L*.66,L*.34,ang,i);
      ctx.fillStyle=tone([100,50,38],1,lit);blob(ctx,p.x+Math.cos(ang)*L*.55,p.y+Math.sin(ang)*L*.55,L*.56,L*.25,ang,i);
      ctx.fillStyle=tone([80,62,52],2,lit);blob(ctx,p.x+Math.cos(ang)*L*.6+.8,p.y+Math.sin(ang)*L*.6-.8,L*.3,L*.1,ang,i);}

function mkTree(part,u,v,h,th,seed){

/* ---------- robot rendering ---------- */
function drawPart(pt,J,lit){
  const f=J.F[pt.fr];DIM=pt.far?1:0;
  const W=pt.pts.map(q=>f(q[0],q[1]));const path=rpoly(W,pt.r*RB);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of W){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}
  const s=clamp(Math.max(x1-x0,y1-y0)*.12,5,17);
  ctx.save();ctx.clip(path);
  cel(path,W,pt.base,lit,s);
  if(pt.acc){const AW=pt.acc.map(q=>f(q[0],q[1]));cel(rpoly(AW,5),AW,COL.trim,lit,s*.6);}
  for(const ru of pt.rust){const RW=ru.sh.map(q=>f(q[0],q[1]));cel(rpoly(RW,ru.rad*.7*RB),RW,COL.rust,lit,5,true);}
  for(const ch of pt.chips){const CW=ch.map(q=>f(q[0],q[1]));cel(rpoly(CW,1.5),CW,COL.bare,lit,2.5,true);}
  if(pt.nr||pt.nc>1){const IW=pt.inset.map(q=>f(q[0],q[1]));ctx.save();ctx.setLineDash([15,5,4,5]);ctx.lineWidth=1.1;ctx.strokeStyle=INK;ctx.globalAlpha=.42;ctx.stroke(rpoly(IW,8*RB));ctx.restore();}
  for(const rv of pt.riv){const o=f(rv[0],rv[1]);ctx.fillStyle=tone(pt.base,0,lit);ctx.beginPath();ctx.arc(o[0],o[1],2.8*RB+.4,0,6.283);ctx.fill();ctx.fillStyle=tone(pt.base,2,lit);ctx.beginPath();ctx.arc(o[0]+LD.x,o[1]+LD.y,1.3,0,6.283);ctx.fill();}
  ctx.restore();
  ink(path,2.3);
  for(const sp of pt.mossSpots)if(!sp.gone)drawMossSpot(sp,f,lit);
  DIM=0;
}

  for(const tr of TREES)if(!tr.gone&&G.shed>=tr.th){tr.gone=true;const a=J.F[PD[tr.part].fr](tr.u,tr.v);spawn({k:'tree',tr,x:a[0],y:a[1],vx:-60-R2()*60,vy:-120,rot:0,vr:-1.2-R2(),life:3.6,ground:80});shedAtPos(a[0],a[1],8);}

}
function events(T,pT,J){

    if(R2()<G.tremor*.5)spawn({k:'puff',tint:1,x:1100+R2()*800,y:GY+20+R2()*50,vy:-14,s:16+R2()*18,life:1.1,a0:.6});}
  if((T>27.6&&T<37&&R2()<.45)||cr(30)){const n=cr(30)?50:1;for(let i=0;i<n;i++)spawn({k:'leaf',x:cam.x+(R2()-.5)*1500/cam.z,y:cam.y-VH*.6/cam.z-R2()*160,vx:R2()*40-20,vy:30+R2()*50,s:7+R2()*7,c:(R2()*6)|0,life:8});}
  if(T>33.8&&T<43){const n=1+((T>35&&T<41)?2:0);for(let i=0;i<n;i++)pourFromRobot(J);}
  if(cr(50.2)||cr(TLIFT)){const big=cr(TLIFT);for(let i=0;i<(big?90:60);i++){const sd=R2()<.5?-1:1;spawn({k:'leaf',gust:true,x:RC[0]+(R2()-.5)*200,y:GY-R2()*100,vx:sd*(300+R2()*(big?1300:900)),vy:-(100+R2()*(big?700:420)),s:7+R2()*8,c:(R2()*6)|0,life:3.6});}
    for(let i=0;i<18;i++)spawn({k:'clump',x:RC[0]+(R2()-.5)*400,y:GY,vx:(R2()-.5)*900,vy:-200-R2()*500,s:3+R2()*4,vr:R2()*12-6,life:2.5,ground:50});}
  if(T>5&&T<60&&R2()<.55&&PT.length<300)spawn({k:'mote',x:cam.x+(R2()-.5)*1500/cam.z,y:cam.y+(R2()-.2)*600/cam.z,s:1.2+R2()*1.8,life:5,vx:0,vy:-8});
}
function fadeAt(T){return clamp(1-sstep(0,2.2,T)+sstep(64.6,67.6,T));}
function render(T){
  updateState(T);camAt(T);LK=clamp(Math.pow(cam.z,-.55),.5,1.5);
  const J=robotJ(T),tau=T-TLIFT;
  stepVines(J);shedCheck(J);events(T,prevT<0?T-.04:prevT,J);stepParticles(T);prevT=T;
  const blurPx=cam.z>1.7?Math.min(8,(cam.z-1.6)*3.6)*RS:0,useBlur=blurPx>.5&&('filter' in ctx),c=useBlur?bgx:ctx;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.fillStyle='#e9d9b2';c.fillRect(0,0,cv.width,cv.height);

  drawL(ctx,LAY.ground,1);

  // robot
  const tiny=J.air?kOfS(J.s):1;

  setL(ctx,1);
  drawBird(birdState(T,J),Math.max(G.light,.5));

  if(T>52)drawSpiral(T);
  for(const rg of RINGS)drawRing(rg,T);
  drawParticles(T);
  drawMist(T,1.1,900,.22*(1-G.light*.5),14,0);
  drawShafts(T,J);
  drawL(ctx,LAY.fg,1.3);
  // ----- grade -----
  ctx.setTransform(RS,0,0,RS,0,0);
  const cool=(1-G.light)*.62;if(cool>.01){ctx.globalCompositeOperation='multiply';ctx.globalAlpha=cool;ctx.fillStyle='rgb(104,134,206)';ctx.fillRect(0,0,VW,VH);}
  ctx.globalCompositeOperation='screen';ctx.globalAlpha=1;
  let rg=ctx.createRadialGradient(VW*.9,VH*.2,0,VW*.9,VH*.2,VW*.95);rg.addColorStop(0,`rgba(255,200,120,${.1+G.light*.3})`);rg.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,VW,VH);
  if(G.flash>.01){ctx.fillStyle=`rgba(255,246,220,${G.flash})`;ctx.fillRect(0,0,VW,VH);}
  ctx.globalCompositeOperation='source-over';
  rg=ctx.createRadialGradient(VW/2,VH/2,VH*.45,VW/2,VH/2,VW*.66);rg.addColorStop(0,'rgba(8,18,28,0)');rg.addColorStop(1,'rgba(8,18,28,.42)');ctx.fillStyle=rg;ctx.fillRect(0,0,VW,VH);
  if(grainPat){ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.1;ctx.translate(R2()*200,R2()*200);ctx.fillStyle=grainPat;ctx.fillRect(-200,-200,VW+400,VH+400);ctx.restore();}
  const f=fadeAt(T);if(f>.003){ctx.fillStyle=`rgba(4,6,10,${f})`;ctx.fillRect(0,0,VW,VH);}
}
// patch mist to accept target context
function drawMistTo(c,T,p,y0,alpha,speed,k){setL(c,p);const off=(T*speed)%WW;c.globalAlpha=alpha;if(k)c.globalCompositeOperation='screen';c.drawImage(MIST[k],off,y0,WW,720);c.drawImage(MIST[k],off-WW,y0,WW,720);c.globalCompositeOperation='source-over';c.globalAlpha=1;}

/* =====================================================================
   SOUND (all synthesized, pre-scheduled to the picture)
   ===================================================================== */
let AC=null,MG=null,FGN=null,NB=null,muted=false;
function audioInit(T0){
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:.9;FGN=AC.createGain();
    const comp=AC.createDynamicsCompressor();FGN.connect(MG);MG.connect(comp);comp.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    scheduleAudio(AC.currentTime+.25-T0,T0);
  }catch(e){console.warn('audio',e);}
}
function scheduleAudio(base,T0){
  const A=t=>base+t,now=AC.currentTime;
  const ok=t=>A(t)>now;
  FGN.gain.setValueAtTime(1,A(63));FGN.gain.linearRampToValueAtTime(.0001,A(68));
  const sT=(t,f,dur,vol,type='sine',att=.01,f2)=>{if(!ok(t))return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,A(t));if(f2)o.frequency.exponentialRampToValueAtTime(f2,A(t+dur));
    g.gain.setValueAtTime(.0001,A(t));g.gain.exponentialRampToValueAtTime(vol,A(t+att));g.gain.exponentialRampToValueAtTime(.0001,A(t+dur));o.connect(g);g.connect(FGN);o.start(A(t));o.stop(A(t+dur+.05));};
  const bed=(pts,type,f,q,f2)=>{if(A(pts[pts.length-1][0])<now)return;const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||.7;if(f2){fl.frequency.setValueAtTime(f,A(pts[0][0]));fl.frequency.linearRampToValueAtTime(f2,A(pts[pts.length-1][0]));}
    const g=AC.createGain();g.gain.setValueAtTime(.0001,A(Math.max(0,pts[0][0])));for(const p of pts)g.gain.linearRampToValueAtTime(Math.max(.0001,p[1]),A(p[0]));s.connect(fl);fl.connect(g);g.connect(FGN);s.start(A(pts[0][0]));s.stop(A(pts[pts.length-1][0]+.1));};
  const burst=(t,dur,vol,type,f,f2,q)=>{if(!ok(t))return;const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=type;fl.Q.value=q||1;fl.frequency.setValueAtTime(f,A(t));fl.frequency.exponentialRampToValueAtTime(f2||f,A(t+dur));const g=AC.createGain();g.gain.setValueAtTime(vol,A(t));g.gain.exponentialRampToValueAtTime(.0001,A(t+dur));s.connect(fl);fl.connect(g);g.connect(FGN);s.start(A(t));s.stop(A(t+dur+.05));};
  const creak=(t,dur,f0,f1,vol)=>{if(!ok(t))return;const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f0,A(t));o.frequency.linearRampToValueAtTime(f1,A(t+dur));
    fl.type='bandpass';fl.Q.value=7;fl.frequency.setValueAtTime(260,A(t));fl.frequency.linearRampToValueAtTime(720,A(t+dur));l.frequency.value=11+Math.random()*8;lg.gain.value=vol*.6;g.gain.setValueAtTime(.0001,A(t));g.gain.linearRampToValueAtTime(vol,A(t+dur*.3));g.gain.linearRampToValueAtTime(.0001,A(t+dur));
    l.connect(lg);lg.connect(g.gain);o.connect(fl);fl.connect(g);g.connect(FGN);o.start(A(t));l.start(A(t));o.stop(A(t+dur+.1));l.stop(A(t+dur+.1));};
  const pad=(t,dur,fr,vol)=>{if(A(t+dur)<now)return;fr.forEach(f=>{[-5,5].forEach(dt=>{const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;fl.type='lowpass';fl.frequency.setValueAtTime(380,A(t));fl.frequency.linearRampToValueAtTime(1500,A(t+dur*.6));
    g.gain.setValueAtTime(.0001,A(t));g.gain.linearRampToValueAtTime(vol,A(t+Math.min(3.5,dur*.4)));g.gain.linearRampToValueAtTime(.0001,A(t+dur));o.connect(fl);fl.connect(g);g.connect(FGN);o.start(A(t));o.stop(A(t+dur+.1));});});};
  const N=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99,880,987.77];

  bed([[0,.0001],[1,.012],[60,.01],[67,.0001]],'bandpass',1500,.4);
  bed([[26.2,.0001],[28,.25],[30.4,.6],[33,.42],[34.5,.1],[38,.2],[41.5,.3],[43,.04],[49,.04],[50.2,.45],[53.3,.6],[53.5,.95],[56,.3],[60,.05]],'lowpass',120,.8);
  bed([[48.6,.0001],[50.2,.22],[53.3,.28],[53.6,.5],[56,.2],[62,.02]],'bandpass',900,.5,2400);
  sT(26.3,41,8,.3,'sine',2.5);sT(49,52,5,.3,'sine',2);sT(53.4,90,2.4,.9,'sine',.01,28);burst(53.4,3.6,.8,'lowpass',2600,180);burst(50.2,2.4,.5,'bandpass',300,3200,.8);
  // core / eyes
  sT(18.2,110,5,.05,'sine',1.2);sT(21.4,146,9,.05,'sine',2);sT(24.5,330,3,.03,'sine',.4,420);sT(25.5,440,4,.025,'sine',1,560);
  // birds
  let t=1.2,s=7;const rr=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  while(t<26.2){const n=1+Math.floor(rr()*3),f=2300+rr()*1500;for(let i=0;i<n;i++)sT(t+i*.13,f+i*140,.085,.03,'sine',.012,f*(1.2+rr()*.3));t+=.5+rr()*2.2;}
  burst(30,.9,.2,'bandpass',3200,1800,1);for(let i=0;i<26;i++){const f=2400+rr()*1800;sT(30+rr()*2.2,f,.09,.03,'sine',.01,f*1.3);}
  // piano — quiet, then tolling, then rising
  const ph=[[3,5,4,2],[1,3,2,0],[3,6,5,3],[2,4,3,1]];let k=0;
  for(let tt=2.2;tt<26;tt+=.9){const p=ph[Math.floor(k/4)%4][k%4];note(tt,p,.07+.02*Math.sin(k*.7));if(k%4==0)sT(tt,73.4,3.5,.1,'sine',.02);k++;}
  for(let tt=27;tt<43;tt+=2.6){sT(tt,73.42,4,.14,'sine',.02);sT(tt+.05,110,3,.06,'triangle',.02);if(tt>33)note(tt+1.3,(tt*3|0)%3,.05,3);}
  k=0;for(let tt=43;tt<53.3;tt+=.45-Math.min(.12,(tt-43)*.012)){note(tt,[0,3,5,4,3,5,6,5][k%8],.07+Math.min(.07,(tt-43)*.01),1.8);k++;}
  pad(27,16,[73.4,110,146.8],.035);pad(40,14,[146.8,220,293.66,369.99],.03);pad(48,10,[146.8,220,293.66,369.99,440],.04);pad(53.4,12,[146.8,220,293.66,369.99,440,587.33],.06);
  k=0;for(let tt=53.6;tt<62;tt+=.38){note(tt,[5,6,7,8,6,7,5,8][k%8],.07*Math.max(.3,1-(tt-53.6)/9),2.2);k++;}
  [0,3,5,8].forEach((n,i)=>note(62+i*.12,n,.08,5));
  // creaks, clunks, rustle
  [[33.4,.9,70,52,.16],[34.4,1.4,62,46,.2],[35.6,1.2,80,58,.18],[37.2,1.6,58,90,.22],[38.8,1.2,66,45,.2],[40,.8,100,70,.13],[40.8,1.4,56,40,.24],[42,1,90,60,.12],[44.5,2.8,50,86,.18]].forEach(c=>creak(...c));
  [39.8,41.6].forEach(c=>{burst(c,.3,.5,'bandpass',900,300,3);sT(c,70,.5,.55,'sine',.004,36);});
  for(let tt=34;tt<42;tt+=.25+rr()*.4)burst(tt,.18,.05,'highpass',3500,5000,.6);
  [48.6,48.95,49.35].forEach(c=>burst(c,.25,.4,'bandpass',500,2000,2));
}

/* =====================================================================
   LOADER / MAIN LOOP
   ===================================================================== */
const CFG_MID={seed:5,yb:430,w0:330,w1:1300,dark:[186,30,22],m0:[178,30,26],l0:[170,30,32],h0:[110,36,44],m1:[160,36,36],l1:[110,48,50],h1:[70,75,66],nInt:210};
const CFG_NEAR={seed:9,yb:490,w0:250,w1:1000,dark:[172,42,8],m0:[168,40,12],l0:[150,40,17],h0:[110,40,26],m1:[150,44,20],l1:[100,55,38],h1:[66,85,56],nInt:250,
  limbs:g=>{limb(g,[-60,300],[420,340],[900,150],100,24);limb(g,[2860,330],[2300,410],[1900,190],104,26);limb(g,[-60,-120],[520,-40],[980,-420],74,16);limb(g,[2860,-60],[2300,-120],[1850,-500],80,18);}};
const ui=document.getElementById('ui'),go=document.getElementById('go'),msg=document.getElementById('msg'),bar=document.getElementById('barfill');
let running=false,startMs=0,T0=0,lastTick=-1;
function boot(){
  const steps=[['laying the sky',()=>paintSky(LAY.sky)],['far ridges in mist',()=>paintFar(LAY.far)],['distant trunks',()=>paintMid(LAY.mid)],
   ['far canopy',()=>{paintCanopy(LAY.cMid,CFG_MID);haze(LAY.cMid,'206,224,214',.3,-1100,500);}],['old trees',()=>paintNear(LAY.near)],
   ['near canopy',()=>paintCanopy(LAY.cNear,CFG_NEAR)],['the clearing floor',()=>paintGround(LAY.ground)],['leaves up close',()=>paintFg(LAY.fg)],
   ['waking the guardian',()=>{buildTufts();buildMist();buildBirds();buildSpiral();buildGrain();initRobot();}]];
  let i=0;
  (function next(){
    if(i>=steps.length){msg.textContent='ready';bar.style.width='100%';go.style.display='block';return;}
    msg.textContent=steps[i][0]+'…';bar.style.width=(i/steps.length*100)+'%';
    setTimeout(()=>{try{steps[i][1]();}catch(e){console.error(steps[i][0],e);}i++;next();},30);
  })();
}
function resetWorld(){VINES.length=0;TREES.length=0;initRobot();PT.length=0;LIFTB=null;prevT=-1;lastTick=-1;}
function start(){
  const m=/t=(\d+(\.\d+)?)/.exec(location.hash);T0=m?parseFloat(m[1]):0;
  ui.style.opacity=0;setTimeout(()=>ui.style.display='none',1700);
  startMs=performance.now();running=true;lastTick=-1;prevT=-1;
  if(AC){try{AC.close();}catch(e){}AC=null;}audioInit(T0);
  requestAnimationFrame(loop);
}
function loop(now){
  if(!running)return;
  const T=Math.max(0,(now-startMs)/1000+T0),tick=Math.floor(T*24);
  if(tick!==lastTick){lastTick=tick;try{render(tick/24);}catch(e){console.error(e);}}
  if(T>68.4){running=false;if(AC){try{AC.close();}catch(e){}AC=null;}end();return;}
  requestAnimationFrame(loop);
}
function end(){ui.style.display='flex';ui.style.opacity=1;ui.querySelector('h1').textContent='終';msg.textContent='';document.getElementById('bar').style.display='none';go.textContent='REPLAY';}
go.addEventListener('click',()=>{if(go.textContent==='REPLAY')resetWorld();start();});
addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M'){muted=!muted;if(MG)MG.gain.value=muted?0:.9;}
  if((e.key==='r'||e.key==='R')&&go.style.display!=='none'){if(AC){try{AC.close();}catch(x){}AC=null;}resetWorld();start();}
});
boot();
