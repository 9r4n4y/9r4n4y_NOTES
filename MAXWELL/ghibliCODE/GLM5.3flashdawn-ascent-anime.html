<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dawn Ascent — a hand-drawn 2D anime scene</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #060807; height: 100%;
    overflow: hidden; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative; background: #000; box-shadow: 0 0 80px rgba(0,0,0,0.9);
    line-height: 0;
  }
  #stage svg { display: block; width: 100%; height: 100%; }
  #grain {
    position: absolute; inset: 0; pointer-events: none;
    opacity: 0.55; mix-blend-mode: overlay;
  }
  #ui {
    position: absolute; right: 14px; bottom: 12px; display: flex; gap: 8px;
    transition: opacity .6s ease; line-height: 1;
  }
  .ctl {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(240,228,196,0.5); background: rgba(20,24,20,0.45);
    color: #f0e4c4; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(2px); transition: background .25s, opacity .25s;
    user-select: none;
  }
  .ctl:hover { background: rgba(64,72,56,0.6); }
  #hint {
    position: absolute; left: 16px; bottom: 14px; color: rgba(240,228,196,0.55);
    font-size: 11px; letter-spacing: 0.14em; line-height: 1;
    transition: opacity 1.2s ease; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="grain"></div>
    <div id="hint">CLICK TO PAUSE</div>
    <div id="ui">
      <div class="ctl" id="pp" title="pause / play">&#10074;&#10074;</div>
      <div class="ctl" id="rp" title="replay">&#8635;</div>
      <div class="ctl" id="snd" title="sound" style="opacity:0.55">&#9834;</div>
    </div>
  </div>
<script>
/* ============ util.js : deterministic RNG, SVG helpers, path & color tools ============ */
'use strict';
const NS = 'http://www.w3.org/2000/svg';

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let _seed = 0x5EED0721;
let _R = mulberry32(_seed);
let DEFS = null; /* shared <defs> node, assigned by main */
const rr = (a, b) => a + (b - a) * _R();
const ri = (a, b) => Math.floor(rr(a, b + 0.999));
const pick = arr => arr[Math.floor(_R() * arr.length) % arr.length];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

const EZ = {
  linear: t => t,
  i2: t => t * t,
  i3: t => t * t * t,
  o2: t => 1 - (1 - t) * (1 - t),
  o3: t => 1 - Math.pow(1 - t, 3),
  io2: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  io3: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  sm: t => t * t * (3 - 2 * t),
  back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
};

/* deterministic per-index hash (for shake / stepped randoms at runtime) */
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function hash2(n) { const s = Math.sin(n * 269.5 + 183.3) * 24634.6345; return s - Math.floor(s); }

/* ---------- SVG ---------- */
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  if (attrs) for (const k in attrs) { const v = attrs[k]; if (v == null) continue; e.setAttribute(k, v); }
  if (parent) parent.appendChild(e);
  return e;
}
function gp(parent, attrs) { return el('g', attrs || {}, parent); }
function fmt(v) { return Math.round(v * 10) / 10; }
function path(parent, d, attrs) { return el('path', Object.assign({ d }, attrs || {}), parent); }

/* ---------- path builders ---------- */
/* closed catmull-rom -> cubic bezier (organic hand-painted blobs) */
function smoothClosed(pts) {
  const n = pts.length;
  let d = 'M ' + fmt(pts[0][0]) + ' ' + fmt(pts[0][1]);
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ' C ' + fmt(c1x) + ' ' + fmt(c1y) + ', ' + fmt(c2x) + ' ' + fmt(c2y) + ', ' + fmt(p2[0]) + ' ' + fmt(p2[1]);
  }
  return d + ' Z';
}
/* irregular organic blob */
function blobD(cx, cy, rx, ry, o) {
  o = o || {};
  const n = o.n || 9, irr = o.irr == null ? 0.32 : o.irr, rot = o.rot || 0;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    const k = 1 + (_R() * 2 - 1) * irr;
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return smoothClosed(pts);
}
/* tapered open ribbon along points (trail beams, rust streaks) */
function ribbonD(pts, w0, w1) {
  const n = pts.length;
  const L = [], Rt = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const w = lerp(w0, w1, i / (n - 1)) / 2;
    L.push([pts[i][0] - dy * w, pts[i][1] + dx * w]);
    Rt.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  let d = 'M ' + fmt(L[0][0]) + ' ' + fmt(L[0][1]);
  for (let i = 1; i < n; i++) d += ' L ' + fmt(L[i][0]) + ' ' + fmt(L[i][1]);
  for (let i = n - 1; i >= 0; i--) d += ' L ' + fmt(Rt[i][0]) + ' ' + fmt(Rt[i][1]);
  return d + ' Z';
}
/* grass blade: filled tapered curved blade. lean = px tip offset (+x) */
function bladeD(x, y, len, lean, w) {
  const tx = x + lean, ty = y - len;
  const c1x = x + lean * 0.15 + w * 0.4, c1y = y - len * 0.42;
  const c2x = x + lean * 0.75 - w * 0.2, c2y = y - len * 0.75;
  return 'M ' + fmt(x - w) + ' ' + fmt(y) +
    ' Q ' + fmt(c1x) + ' ' + fmt(c1y) + ' ' + fmt(tx) + ' ' + fmt(ty) +
    ' Q ' + fmt(c2x) + ' ' + fmt(c2y) + ' ' + fmt(x + w) + ' ' + fmt(y) + ' Z';
}
/* wavy stem/vine path */
function vineD(x, y, dx, dy, waves, amp) {
  let d = 'M ' + fmt(x) + ' ' + fmt(y);
  const seg = 1 / waves;
  for (let i = 1; i <= waves; i++) {
    const t = i * seg;
    const mx = x + dx * (t - seg / 2), my = y + dy * (t - seg / 2);
    const nx = -dy, ny = dx;
    d += ' Q ' + fmt(mx + nx * amp) + ' ' + fmt(my + ny * amp) + ' ' + fmt(x + dx * t) + ' ' + fmt(y + dy * t);
  }
  return d;
}
/* small leaf shape centered at 0,0 pointing up, size s */
function leafD(s) {
  return 'M 0 ' + fmt(-s) + ' Q ' + fmt(s * 0.72) + ' ' + fmt(-s * 0.35) + ' ' + fmt(s * 0.12) + ' ' + fmt(s * 0.92) +
    ' Q ' + fmt(-s * 0.62) + ' ' + fmt(s * 0.28) + ' 0 ' + fmt(-s) + ' Z';
}

/* ---------- color ---------- */
function hexRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgbHex(r, g, b) {
  const c = v => ('0' + Math.round(clamp(v, 0, 255)).toString(16)).slice(-2);
  return '#' + c(r) + c(g) + c(b);
}
function mix(c1, c2, t) {
  const a = hexRgb(c1), b = hexRgb(c2);
  return rgbHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}
function shade(c, amt) { /* amt -1..1 : darker..lighter */
  return amt < 0 ? mix(c, '#1a1712', -amt) : mix(c, '#fff8e8', amt);
}
function rgba(c, a) { const v = hexRgb(c); return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')'; }

/* ============ bg.js : hand-painted gouache forest & light ============ */
'use strict';

const PAL = {
  skyTop: '#6fa3b5', sky2: '#a9c6bd', sky3: '#e3d6a4', sky4: '#f7e7b4', sky5: '#fff3cf',
  sun: '#fff6d8', sunWarm: '#ffe3a0',
  farTree: '#93af9e', farTree2: '#a9bfa9',
  leafD: '#42604a', leaf: '#5d7f5c', leafL: '#87a568', leafSun: '#c3c483',
  trunk: '#4c4336', trunkL: '#6e5d49', trunkD: '#3a3428',
  grassD: '#43603e', grass: '#5f8050', grassL: '#94a860', grassSun: '#c9c877',
  soil: '#4e4636', soilL: '#6b5c45',
  mist: '#f2efdc', mistWarm: '#fdf3d5',
  ray: '#fff3cd',
  ink: '#3a332b',
  glowA: '#ffd98c', glowB: '#ffb45e'
};

let _uid = 0;
function uid(p) { return (p || 'u') + (_uid++); }

function linGrad(defs, stops, x1, y1, x2, y2) {
  const id = uid('lg');
  const lg = el('linearGradient', { id, x1: x1 == null ? 0 : x1, y1: y1 == null ? 0 : y1, x2: x2 == null ? 0 : x2, y2: y2 == null ? 1 : y2 }, defs);
  stops.forEach(s => el('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] == null ? 1 : s[2] }, lg));
  return id;
}
function radGrad(defs, stops, cx, cy, r) {
  const id = uid('rg');
  const rg = el('radialGradient', { id, cx: cx == null ? .5 : cx, cy: cy == null ? .5 : cy, r: r == null ? .5 : r }, defs);
  stops.forEach(s => el('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] == null ? 1 : s[2] }, rg));
  return id;
}

/* ---------------- sky & light ---------------- */
function sky(parent, defs, stops) {
  const id = linGrad(defs, stops);
  return el('rect', { x: -40, y: -40, width: 2000, height: 1160, fill: 'url(#' + id + ')' }, parent);
}
function sunGlow(parent, defs, cx, cy, r, c1, c2, a2) {
  const id = radGrad(defs, [[0, c1, 1], [0.42, c2, a2 == null ? 0.55 : a2], [0.75, c2, (a2 == null ? 0.55 : a2) * 0.35], [1, c2, 0]], .5, .5, .5);
  return el('ellipse', { cx, cy, rx: r, ry: r * 0.92, fill: 'url(#' + id + ')' }, parent);
}

/* god-ray shafts through canopy */
function rays(parent, o) {
  const g = gp(parent, { filter: 'url(#b8)', style: 'mix-blend-mode:screen' });
  const items = [];
  const n = o.n || 5;
  for (let i = 0; i < n; i++) {
    const a = o.ang + rr(-0.15, 0.15);
    const w = rr(o.w * 0.45, o.w * 1.5);
    const len = o.len * rr(0.55, 1.15);
    const x1 = o.cx + rr(-o.spread, o.spread), y1 = o.cy + rr(-30, 30);
    const dx = Math.cos(a), dy = Math.sin(a);
    const px = -dy, py = dx;
    const wEnd = w * rr(2.0, 3.0);
    const d = 'M ' + fmt(x1 - px * w / 2) + ' ' + fmt(y1 - py * w / 2) +
      ' L ' + fmt(x1 + px * w / 2) + ' ' + fmt(y1 + py * w / 2) +
      ' L ' + fmt(x1 + dx * len + px * wEnd / 2) + ' ' + fmt(y1 + dy * len + py * wEnd / 2) +
      ' L ' + fmt(x1 + dx * len - px * wEnd / 2) + ' ' + fmt(y1 + dy * len - py * wEnd / 2) + ' Z';
    const p = path(g, d, { fill: o.c || PAL.ray, opacity: rr(0.05, 0.13) });
    items.push(p);
  }
  g.__shimmer = items;
  return g;
}

/* ---------------- trees ---------------- */
/* distant hazy tree mass (no detail) */
function farTrees(parent, y, h, c) {
  const g = gp(parent, {});
  let x = -60;
  while (x < 1990) {
    const w = rr(120, 300);
    const th = h * rr(0.55, 1.15);
    path(g, blobD(x + w / 2, y - th * 0.35, w * 0.62, th * 0.72, { irr: 0.42, n: 8 }), { fill: c, opacity: rr(0.75, 1) });
    x += w * rr(0.55, 0.8);
  }
  return g;
}
/* mid-ground tree: trunk + canopy blob cluster + dabs */
function treeMid(parent, o) {
  const g = gp(parent, {});
  const x = o.x, by = o.baseY, h = o.h;
  const tw = o.tw || h * 0.07;
  const lean = rr(-0.05, 0.09);
  const topx = x + lean * h * 0.6;
  path(g, 'M ' + fmt(x - tw / 2) + ' ' + fmt(by) +
    ' Q ' + fmt(x - tw * 0.28 + lean * h * 0.2) + ' ' + fmt(by - h * 0.5) + ' ' + fmt(topx - tw * 0.2) + ' ' + fmt(by - h * 0.8) +
    ' L ' + fmt(topx + tw * 0.36) + ' ' + fmt(by - h * 0.79) +
    ' Q ' + fmt(x + tw * 0.6) + ' ' + fmt(by - h * 0.42) + ' ' + fmt(x + tw / 2) + ' ' + fmt(by) + ' Z',
    { fill: o.trunk || PAL.trunk });
  /* root flare */
  path(g, blobD(x, by - 4, tw * 1.5, tw * 0.5, { irr: 0.5, n: 7 }), { fill: o.trunkD || PAL.trunkD, opacity: 0.7 });
  /* branches */
  for (let i = 0; i < 3; i++) {
    const bY = by - h * rr(0.55, 0.8), dir = _R() < 0.5 ? -1 : 1;
    path(g, 'M ' + fmt(x) + ' ' + fmt(bY) + ' Q ' + fmt(x + dir * h * 0.12) + ' ' + fmt(bY - h * 0.06) + ' ' + fmt(x + dir * h * 0.22) + ' ' + fmt(bY - h * 0.12),
      { stroke: o.trunk || PAL.trunk, 'stroke-width': fmt(tw * 0.3), fill: 'none', 'stroke-linecap': 'round' });
  }
  /* canopy: overlapping mass, darker interior, lit top */
  const blobs = ri(5, 7);
  for (let i = 0; i < blobs; i++) {
    const bx = x + rr(-h * 0.42, h * 0.44), byy = by - h * rr(0.86, 1.14), br = h * rr(0.2, 0.36);
    path(g, blobD(bx, byy, br * 1.25, br * 0.85, { irr: 0.45 }), { fill: o.leafD || PAL.leafD });
  }
  for (let i = 0; i < blobs; i++) {
    const bx = x + rr(-h * 0.38, h * 0.4), byy = by - h * rr(0.88, 1.1), br = h * rr(0.16, 0.3);
    path(g, blobD(bx, byy, br * 1.2, br * 0.82, { irr: 0.45 }), { fill: o.leaf || PAL.leaf, opacity: 0.95 });
  }
  /* under-canopy shadow dabs */
  for (let i = 0; i < 6; i++) {
    const bx = x + rr(-h * 0.42, h * 0.42), byy = by - h * rr(0.8, 0.95);
    path(g, blobD(bx, byy, rr(8, 18), rr(4, 9), { irr: 0.55, n: 6 }), { fill: shade(o.leafD || PAL.leafD, -0.25), opacity: rr(0.4, 0.75) });
  }
  /* painted dabs: shadow side then sun side */
  for (let i = 0; i < 9; i++) {
    const bx = x + rr(-h * 0.5, h * 0.5), byy = by - h * rr(0.84, 1.16);
    path(g, blobD(bx, byy, rr(5, 13), rr(3, 8), { irr: 0.55, n: 6 }), { fill: o.leafL || PAL.leafL, opacity: rr(0.25, 0.55) });
  }
  for (let i = 0; i < 6; i++) {
    const bx = x + rr(0, h * 0.5), byy = by - h * rr(0.9, 1.12);
    path(g, blobD(bx, byy, rr(4, 10), rr(2, 6), { irr: 0.55, n: 6 }), { fill: o.leafSun || PAL.leafSun, opacity: rr(0.3, 0.6) });
  }
  return g;
}
/* big dark canopy mass along top edge */
function canopyTop(parent, o) {
  const g = gp(parent, {});
  let x = o.x0;
  while (x < o.x1) {
    const w = rr(160, 320);
    const dip = o.y + rr(0, o.range);
    path(g, blobD(x + w / 2, o.y - 160 + (dip - o.y) * 0.4, w * 0.75, 260, { irr: 0.35 }), { fill: o.c || PAL.leafD });
    /* scallop dabs on lower edge */
    for (let i = 0; i < 5; i++) {
      path(g, blobD(x + rr(0, w), dip - rr(0, 30), rr(24, 52), rr(14, 30), { irr: 0.5, n: 7 }),
        { fill: _R() < 0.4 ? (o.cL || PAL.leaf) : (o.c || PAL.leafD), opacity: rr(0.6, 1) });
    }
    x += w * rr(0.6, 0.85);
  }
  /* sun-side rim dabs */
  for (let i = 0; i < (o.dabs || 0); i++) {
    path(g, blobD(rr(o.x0, o.x1), o.y + rr(-20, o.range * 0.8), rr(5, 12), rr(3, 7), { irr: 0.55, n: 6 }),
      { fill: o.rim || PAL.leafSun, opacity: rr(0.2, 0.5) });
  }
  return g;
}
/* foreground framing trunk with bark strokes & moss */
function trunkFore(parent, o) {
  const g = gp(parent, {});
  const x = o.x, w = o.w, top = o.top, by = o.baseY;
  const lean = o.lean || 0;
  path(g, 'M ' + fmt(x - w / 2) + ' ' + fmt(by) +
    ' C ' + fmt(x - w * 0.62 + lean) + ' ' + fmt(by - (by - top) * 0.4) + ' ' + fmt(x - w * 0.4 + lean * 1.5) + ' ' + fmt(top + (by - top) * 0.2) + ' ' + fmt(x - w * 0.46 + lean * 2) + ' ' + fmt(top) +
    ' L ' + fmt(x + w * 0.5 + lean * 2) + ' ' + fmt(top) +
    ' C ' + fmt(x + w * 0.42 + lean * 1.5) + ' ' + fmt(top + (by - top) * 0.25) + ' ' + fmt(x + w * 0.66 + lean) + ' ' + fmt(by - (by - top) * 0.38) + ' ' + fmt(x + w / 2) + ' ' + fmt(by) + ' Z',
    { fill: o.c || PAL.trunkD });
  /* bark strokes */
  for (let i = 0; i < (o.strokes || 14); i++) {
    const sx = x + rr(-w * 0.4, w * 0.4), sy = rr(top + 30, by - 40);
    const sl = rr(30, 130), sw = rr(1.5, 4);
    path(g, 'M ' + fmt(sx) + ' ' + fmt(sy) + ' q ' + fmt(rr(-6, 6)) + ' ' + fmt(sl * 0.5) + ' ' + fmt(rr(-8, 8)) + ' ' + fmt(sl),
      { stroke: _R() < 0.5 ? shade(o.c || PAL.trunkD, 0.22) : shade(o.c || PAL.trunkD, -0.35), 'stroke-width': fmt(sw), fill: 'none', opacity: rr(0.3, 0.7), 'stroke-linecap': 'round' });
  }
  /* side light */
  if (o.lit) {
    path(g, 'M ' + fmt(x + w * 0.3) + ' ' + fmt(by - 10) + ' C ' + fmt(x + w * 0.34) + ' ' + fmt(by - (by - top) * 0.4) + ' ' + fmt(x + w * 0.3) + ' ' + fmt(top + 120) + ' ' + fmt(x + w * 0.36) + ' ' + fmt(top + 10),
      { stroke: o.lit, 'stroke-width': fmt(w * 0.14), fill: 'none', opacity: 0.5, 'stroke-linecap': 'round', filter: 'url(#b2)' });
  }
  /* moss clumps + hanging vine */
  for (let i = 0; i < 4; i++) {
    const my = rr(top + 60, by - 80);
    path(g, blobD(x + (o.side || 1) * w * rr(0.1, 0.42), my, rr(10, 26), rr(8, 18), { irr: 0.5, n: 7 }),
      { fill: _R() < 0.5 ? PAL.leaf : PAL.leafL, opacity: rr(0.5, 0.9) });
  }
  if (o.vine) {
    const vx = x + (o.side || 1) * w * 0.3;
    const vg = gp(g, {});
    path(vg, vineD(vx, top + 20, rr(-30, 10), by - top - 60, 5, rr(14, 30)), { stroke: '#4c6b3c', 'stroke-width': rr(2.5, 4), fill: 'none' });
    for (let i = 0; i < 9; i++) {
      const t = i / 9, lx = vx + rr(-30, 10) * t, ly = top + 30 + (by - top - 70) * t + Math.sin(t * 9) * 12;
      path(vg, leafD(rr(7, 13)), { fill: _R() < 0.5 ? '#5d844a' : '#77984f', opacity: rr(0.8, 1), transform: 'translate(' + fmt(lx) + ' ' + fmt(ly) + ') rotate(' + fmt(rr(-70, 70)) + ')' });
    }
  }
  return g;
}

/* ---------------- ground ---------------- */
function ground(parent, o) {
  const g = gp(parent, {});
  const y = o.y, w = 2000;
  /* soil */
  path(g, 'M -40 ' + fmt(y + 6) + ' Q 300 ' + fmt(y - 10) + ' 700 ' + fmt(y + 2) + ' T 1400 ' + fmt(y - 4) + ' T 2040 ' + fmt(y + 4) + ' L 2040 1120 L -40 1120 Z',
    { fill: o.soil || PAL.soil });
  /* grass mass edge */

/* ---------------- falling / tumbling leaves ---------------- */
/* each leaf: deterministic params; analytic position from absolute t */
function makeLeaves(parent, n, o) {
  const g = gp(parent, {});
  const items = [];
  const LEAFCOLS = o.cols || ['#7d9c54', '#93ac5e', '#aabf6a', '#c9c176', '#b08f4e', '#6d8a4c'];
  for (let i = 0; i < n; i++) {
    const p = {
      x0: o.x0 + rr(0, o.w), span: o.h,
      y0: o.y0 + rr(0, o.h * 0.8),
      vy: rr(o.vy0, o.vy1),
      swA: rr(o.swA0, o.swA1), swF: rr(0.5, 1.1), ph: rr(0, TAU),
      rot0: rr(0, 360), rotV: rr(-160, 160), tumF: rr(1.2, 2.6),
      s: rr(o.s0, o.s1), col: LEAFCOLS[ri(0, LEAFCOLS.length - 1)],
      t0: o.t0 != null ? o.t0 + rr(0, o.tSpread || 0) : 0,
      windK: rr(0.6, 1.4), drift: rr(-6, 10)
    };
    const lg = gp(g, {});
    path(lg, leafD(p.s), { fill: p.col, stroke: o.ink ? 'rgba(58,50,43,0.4)' : 'none', 'stroke-width': 0.8 });
    path(lg, 'M 0 ' + fmt(-p.s) + ' L ' + fmt(p.s * 0.1) + ' ' + fmt(p.s * 0.85), { stroke: shade(p.col, -0.3), 'stroke-width': 0.8, fill: 'none' });
    items.push({ p, n: lg });
  }
  g.__update = function (t, wind) {
    for (const it of items) {
      const p = it.p;
      let tt = t - p.t0;
      if (tt < 0) { it.n.setAttribute('opacity', 0); continue; }
      if (o.life) { const a = 1 - (tt / o.life); if (a <= 0) { it.n.setAttribute('opacity', 0); continue; } it.n.setAttribute('opacity', clamp(a * 3, 0, 1)); }
      else it.n.setAttribute('opacity', 1);
      if (o.loop) { tt = tt % o.loop; }
      const y = p.y0 + p.vy * tt + Math.sin(tt * p.swF * 2.2 + p.ph) * 8;
      const x = p.x0 + p.drift * tt * 0.1 + Math.sin(tt * p.swF + p.ph) * p.swA + (wind || 0) * p.windK;
      const rot = p.rot0 + p.rotV * tt * 0.1;
      const sc = 0.35 + 0.65 * Math.abs(Math.sin(tt * p.tumF + p.ph)); /* 2D tumble illusion */
      it.n.setAttribute('transform', 'translate(' + fmt(x) + ' ' + fmt(y) + ') rotate(' + fmt(rot) + ') scale(' + fmt(sc) + ' 1)');
    }
  };
  return g;
}

/* ---------------- dust puffs ---------------- */
function makePuff(parent, o) {
  /* one puff event: o {x,y,t0,n,scale,col,ry} */
  const g = gp(parent, {});
  const blobs = [];
  for (let i = 0; i < (o.n || 6); i++) {
    const b = {
      dx: rr(-1, 1) * (o.sx || 40), dy: rr(-0.4, 0.25) * (o.sy || 26),
      r: rr(8, 22) * (o.scale || 1), ph: rr(0, TAU),
      op: rr(0.35, 0.7)
    };
    blobs.push(path(g, blobD(0, 0, b.r, b.r * 0.62, { irr: 0.5, n: 7 }), { fill: o.col || '#cfc3a2', opacity: 0 }));
  }
  const life = o.life || 1.5;
  const fps = 8;
  g.__update = function (t) {
    const age = t - o.t0;
    if (age < 0 || age > life) { g.setAttribute('opacity', 0); return; }
    g.setAttribute('opacity', 1);
    const k = age / life;
    const kk = Math.floor(k * fps) / fps;
    const grow = 0.5 + kk * 1.8;
    for (let i = 0; i < blobs.length; i++) {
      const dxi = Math.sin(i * 2.4 + 1) * (o.sx || 40);
      const dyi = -Math.abs(Math.cos(i * 1.7)) * (o.sy || 26);
      const x = o.x + dxi * grow * 0.9;
      const y = o.y + dyi * grow * 0.8 + kk * 14;
      blobs[i].setAttribute('transform', 'translate(' + fmt(x) + ' ' + fmt(y) + ') scale(' + fmt(grow) + ')');
      blobs[i].setAttribute('opacity', fmt((0.55 - kk * 0.55) * (0.55 + hash1(i * 7 + Math.floor(t * fps)) * 0.4)));
    }
  };
  return g;
}

/* ---------------- speed lines (gale burst) ---------------- */
function makeSpeedLines(parent, o) {
  const g = gp(parent, { style: 'mix-blend-mode:screen', filter: 'url(#b2)' });
  const lines = [];
  for (let i = 0; i < o.n; i++) {
    const a = rr(o.a0, o.a1);
    const r0 = o.r0 * rr(0.55, 1.15);
    const len = rr(o.len0, o.len1);
    const w = rr(2.5, 8);
    const dx = Math.cos(a), dy = Math.sin(a);
    const d = ribbonD([[o.cx + dx * r0, o.cy + dy * r0], [o.cx + dx * (r0 + len * 0.6), o.cy + dy * (r0 + len * 0.6)], [o.cx + dx * (r0 + len), o.cy + dy * (r0 + len)]], w, w * 0.2);
    lines.push(path(g, d, { fill: o.col || '#fff6dd', opacity: 0 }));
  }
  g.__update = function (t) {
    const on = t >= o.t0 && t <= o.t1;
    const fps = 12;
    const fr = Math.floor(t * fps);
    for (let i = 0; i < lines.length; i++) {
      if (!on) { lines[i].setAttribute('opacity', 0); continue; }
      const h = hash2(i * 13.7 + fr);
      const env = clamp((t - o.t0) / 0.12, 0, 1) * clamp((o.t1 - t) / 0.5, 0, 1);
      lines[i].setAttribute('opacity', fmt(h < 0.55 ? (0.25 + h * 0.5) * env : 0));
    }
  };
  return g;
}

/* ---------------- birds (flying, deterministic paths) ---------------- */
/* flight spec: {t0,t1, from:[x,y], ctrl:[[..],[..]], to:[x,y], flapFps} — cubic bezier */
function birdFly(bird, t, spec) {
  if (t < spec.t0 || t > spec.t1) { bird.setAttribute('opacity', 0); return; }
  bird.setAttribute('opacity', 1);
  const u = clamp((t - spec.t0) / (spec.t1 - spec.t0), 0, 1);
  const e = spec.ease ? EZ[spec.ease](u) : u;
  const p0 = spec.from, p1 = spec.c1, p2 = spec.c2, p3 = spec.to;
  const x = (1 - e) ** 3 * p0[0] + 3 * (1 - e) ** 2 * e * p1[0] + 3 * (1 - e) * e * e * p2[0] + e ** 3 * p3[0];
  const y = (1 - e) ** 3 * p0[1] + 3 * (1 - e) ** 2 * e * p1[1] + 3 * (1 - e) * e * e * p2[1] + e ** 3 * p3[1];
  /* tangent for heading */
  const dx = 3 * (1 - e) ** 2 * (p1[0] - p0[0]) + 6 * (1 - e) * e * (p2[0] - p1[0]) + 3 * e * e * (p3[0] - p2[0]);
  const dy = 3 * (1 - e) ** 2 * (p1[1] - p0[1]) + 6 * (1 - e) * e * (p2[1] - p1[1]) + 3 * e * e * (p3[1] - p2[1]);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  const fps = spec.flapFps || 9;
  const fr = Math.floor(t * fps);
  const cycle = [0, 1, 2, 1][fr % 4];
  /* glide sometimes */
  const glide = spec.glide && hash1(Math.floor(t / 0.8) * 3.1 + (spec.id || 0)) < 0.3;
  bird.__flap(glide ? -1 : cycle);
  const bob = Math.sin(t * 6 + (spec.id || 0)) * 3;
  bird.setAttribute('transform', 'translate(' + fmt(x) + ' ' + fmt(y + bob) + ') rotate(' + fmt(clamp(ang, -35, 35) * 0.5) + ') scale(' + (spec.scale || 1) + ')');
}

/* ---------------- launch trail (curving beam of light + mist) ---------------- */
function makeTrail(parent, pathPts, o) {
  /* pathPts: sampled [x,y,tArrive] */
  const g = gp(parent, {});
  const glow = gp(g, { filter: 'url(#b8)', style: 'mix-blend-mode:screen' });
  const core = gp(g, {});
  const mist = gp(g, { filter: 'url(#b10)' });
  const segs = [], cores = [], mists = [];
  const step = o.step || 2;
  for (let i = 0; i < pathPts.length - step; i += step) {
    const a = pathPts[i], b = pathPts[i + step];
    const u = i / pathPts.length;
    const w = lerp(o.w0, o.w1, u);
    segs.push(path(glow, ribbonD([a, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], b], w * 2.2, w * 2.0), { fill: o.col || '#ffe9b0', opacity: 0 }));
    cores.push(path(core, ribbonD([a, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], b], w * 0.7, w * 0.6), { fill: '#fffdf2', opacity: 0 }));
    if (i % 6 === 0) mists.push(path(mist, blobD(a[0], a[1], w * 1.6, w * 1.1, { irr: 0.5, n: 8 }), { fill: '#fdf6e2', opacity: 0 }));
  }
  g.__update = function (t) {
    for (let i = 0; i < segs.length; i++) {
      const tau = pathPts[Math.min(i * step, pathPts.length - 1)][2];
      const age = t - tau;
      if (age < 0) { segs[i].setAttribute('opacity', 0); cores[i].setAttribute('opacity', 0); continue; }
      const a = clamp(1 - age / (o.fade || 2.8), 0, 1);
      segs[i].setAttribute('opacity', fmt(a * 0.75));
      cores[i].setAttribute('opacity', fmt(a * 0.95));
    }
    for (let i = 0; i < mists.length; i++) {
      const idx = i * 6;
      const tau = pathPts[Math.min(idx, pathPts.length - 1)][2];
      const age = t - tau;
      if (age < 0) { mists[i].setAttribute('opacity', 0); continue; }
      const a = clamp(1 - age / (o.mistFade || 7), 0, 1);
      const grow = 1 + age * 0.25;
      mists[i].setAttribute('opacity', fmt(a * 0.5));
      mists[i].setAttribute('transform', 'translate(' + fmt(pathPts[idx][0]) + ' ' + fmt(pathPts[idx][1]) + ') scale(' + fmt(grow) + ')');
    }
  };
  return g;
}

/* ---------------- ground tremble / camera shake ---------------- */
function shakeT(t, amp, fps) {
  fps = fps || 10;
  const fr = Math.floor(t * fps);
  return [(hash1(fr) * 2 - 1) * amp, (hash2(fr) * 2 - 1) * amp];
}

/* ---------------- film grain tiles ---------------- */
function grainDataURL(seed, size) {
  size = size || 140;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const rnd = mulberry32(seed);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 118 + (rnd() * 74 - 37);
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 26 + rnd() * 26;
  }
  ctx.putImageData(img, 0, 0);
  return cv.toDataURL();
}

/* master camera-crop helper: place world coords (robot space) into frame */
function camT(scale, wx, wy, sx, sy) {
  /* screen = world*scale + T  where T = s - w*scale */
  return 'translate(' + fmt(sx - wx * scale) + ' ' + fmt(sy - wy * scale) + ') scale(' + scale + ')';
}
/* maps torso-local coords -> world coords for a pose (hip translate + torso rotation) */
function torsoXform(pose) {
  const a = (pose.torso || 0) * Math.PI / 180, hip = pose.hip || 0, px = 0, py = -352;
  return (x, y) => {
    const dx = x - px, dy = y - py;
    return [px + dx * Math.cos(a) - dy * Math.sin(a), py + dx * Math.sin(a) + dy * Math.cos(a) + hip];
  };
}
function screenOf(scale, ax, ay, sx, sy, wx, wy) {
  return [sx + (wx - ax) * scale, sy + (wy - ay) * scale];
}

const RISE_SEGS = [
  { t0: 28.0, t1: 29.3, a: 'kneel', b: 'kneel' },
  { t0: 29.3, t1: 30.15, a: 'kneel', b: 'plant', fps: 7, ez: 'i2' },

  { t0: 32.75, t1: 33.35, a: 'push', b: 'push' },
  { t0: 33.35, t1: 34.75, a: 'push', b: 'half', fps: 8, ez: 'io2' },
  { t0: 34.75, t1: 35.15, a: 'half', b: 'half' },

  { t0: 36.75, t1: 37.6, a: 'stand', b: 'look', fps: 7, ez: 'io2' }

function risePose(t) {
  for (const s of RISE_SEGS) {
    if (t >= s.t0 && t < s.t1) {
      let u = (t - s.t0) / (s.t1 - s.t0);
      if (s.fps) {
        const tq = s.t0 + Math.floor((t - s.t0) * s.fps) / s.fps;
        u = clamp((tq - s.t0) / (s.t1 - s.t0), 0, 1);
      }
      const e = EZ[s.ez || 'linear'](u);
      const p = lerpPose(POSES[s.a], POSES[s.b], e);
      /* micro hand-drawn jitter while moving */
      if (s.a !== s.b) {
        const fr = Math.floor(t * 9);
        p.torso += (hash1(fr) - 0.5) * 0.7;
        p.head += (hash2(fr) - 0.5) * 0.9;
      } else {
        p.torso += Math.sin(t * 0.9) * 0.7; /* breath */
      }
      return p;
    }
  }
  return POSES.look;
}

function launchPos(u) {
  /* cubic bezier P0(790,930) P1(860,540) P2(1150,260) P3(1700,-40) */
  const p0 = [790, 930], p1 = [860, 540], p2 = [1150, 260], p3 = [1700, -40];
  const e = u;
  const x = (1 - e) ** 3 * p0[0] + 3 * (1 - e) ** 2 * e * p1[0] + 3 * (1 - e) * e * e * p2[0] + e ** 3 * p3[0];
  const y = (1 - e) ** 3 * p0[1] + 3 * (1 - e) ** 2 * e * p1[1] + 3 * (1 - e) * e * e * p2[1] + e ** 3 * p3[1];
  const dx = 3 * (1 - e) ** 2 * (p1[0] - p0[0]) + 6 * (1 - e) * e * (p2[0] - p1[0]) + 3 * e * e * (p3[0] - p2[0]);
  const dy = 3 * (1 - e) ** 2 * (p1[1] - p0[1]) + 6 * (1 - e) * e * (p2[1] - p1[1]) + 3 * e * e * (p3[1] - p2[1]);
  return [x, y, Math.atan2(dy, dx) * 180 / Math.PI];
}
function updateShot7(t) {
  const g = SHOTS[6].node;
  const T0 = 42.9, T1 = 46.1;

    const u = i / 60;
    const [x, y] = launchPos(EZ.i3(u) * 0.0 + u); /* path sampled in u; easing applied on u below */
    const ue = EZ.i2(u);

    const tau = T0 + ue * (T1 - T0);

  }
  g.__trail.__update(t);
  /* sprite along path */
  const spr = g.__spr;
  if (t < T0) {
    spr.setAttribute('opacity', 1);
    const p = launchPos(0);
    spr.setAttribute('transform', 'translate(' + fmt(p[0]) + ' ' + fmt(p[1]) + ') scale(0.62)');
    /* pre-launch crouch tremble */
    const fr = Math.floor(t * 10);
    spr.setAttribute('transform', 'translate(' + fmt(p[0] + (hash1(fr) - 0.5) * 3) + ' ' + fmt(p[1] + (hash2(fr) - 0.5) * 2 + 8) + ') scale(0.62)');
  } else if (t < T1 + 0.4) {
    spr.setAttribute('opacity', 1);
    const u = clamp((t - T0) / (T1 - T0), 0, 1);
    const ue = EZ.i2(u);
    const [x, y, ang] = launchPos(ue);
    const sc = lerp(0.62, 0.3, u);
    const fr = Math.floor(t * 14);
    /* flame flicker */
    const fl = spr.__sprite.__flames;
    const flen = [1, 1.25, 0.85, 1.15][fr % 4];
    fl[0].setAttribute('transform', 'scale(' + fmt(flen) + ' 1)');
    fl[1].setAttribute('transform', 'scale(' + fmt(flen * 0.9) + ' 1)');
    fl[2].setAttribute('transform', 'scale(' + fmt(flen * 1.1) + ' 1)');
    spr.setAttribute('transform', 'translate(' + fmt(x) + ' ' + fmt(y) + ') rotate(' + fmt(clamp(ang * 0.6, -10, 80)) + ') scale(' + fmt(sc) + ')');
  } else spr.setAttribute('opacity', 0);
  /* spiral leaves */
  for (const it of g.__spiral) {
    const p = it.p;
    const tt = (t * p.sp / p.span * p.span + p.ph * 40);
    const y = p.y0 + ((t * p.sp + p.ph * 100) % p.span);
    const x = p.cx + Math.sin(y * 0.016 * p.swF + p.ph) * p.swA;
    const rot = t * p.rotV * 0.3 + p.ph * 60;
    const sc = 0.4 + 0.6 * Math.abs(Math.sin(t * p.swF + p.ph));

  birdFly(g.__ret[0], t, { t0: 47.6, t1: 53.4, from: [-40, 700], c1: [400, 620], c2: [800, 560], to: [1300, 480], scale: 0.7, flapFps: 7, glide: true, id: 21 });
  birdFly(g.__ret[1], t, { t0: 48.4, t1: 53.6, from: [-60, 760], c1: [420, 700], c2: [900, 640], to: [1500, 560], scale: 0.58, flapFps: 6, glide: true, id: 22 });
  birdFly(g.__ret[2], t, { t0: 49.2, t1: 54.2, from: [1960, 640], c1: [1500, 580], c2: [1100, 660], to: [600, 560], scale: 0.62, flapFps: 7, glide: true, id: 23 });
  /* end fade to warm white, then main.js black handles the rest */
  g.__fadeW.setAttribute('opacity', fmt(clamp((t - 50.6) / 2.2, 0, 1)));

/* ============ audio.js : procedural dawn soundscape (optional, starts muted) ============ */
'use strict';

const SoundEngine = {
  ctx: null, master: null, on: false,
  layers: {},
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    this.ctx = ctx;
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);
    /* noise buffer */
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    this.noiseBuf = buf;
    /* wind layer */
    const wind = this.mkNoise(400, 'lowpass', 0.6);
    wind.filter.frequency.value = 320; wind.filter.Q.value = 0.4;
    this.layers.wind = wind;
    /* rumble layer */
    const rum = this.mkNoise(90, 'lowpass', 1.2);
    this.layers.rumble = rum;
    /* engine layer (higher roar) */
    const eng = this.mkNoise(900, 'bandpass', 1.0);
    eng.filter.Q.value = 0.7;
    this.layers.engine = eng;
  },
  mkNoise(freq, type, gain) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = type; filter.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(filter); filter.connect(g); g.connect(this.master);
    src.start();
    return { src, filter, gain: g };
  },
  setOn(v) {
    this.init();
    if (!this.ctx) return false;
    this.on = v;
    if (v && this.ctx.state === 'suspended') this.ctx.resume();
    this.master.gain.linearRampToValueAtTime(v ? 0.9 : 0, this.ctx.currentTime + 0.4);
    return true;
  },
  /* called every frame with master timeline t and previous t */
  update(t, prevT) {
    if (!this.ctx || !this.on) return;
    const L = this.layers;
    const set = (layer, g, f) => {
      layer.gain.gain.setTargetAtTime(g, this.ctx.currentTime, 0.12);
      if (f) layer.filter.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.15);
    };
    /* wind bed */
    let wind = 0.045 + Math.sin(t * 0.4) * 0.012;
    if (t > 37.0) wind += clamp((t - 37.0) / 1.4, 0, 1) * 0.16;
    if (t > 41.4) wind += clamp((41.9 - t) / 2.5, 0, 1) * 0.1;
    if (t > 42.8 && t < 47) wind += 0.06;
    set(L.wind, wind, 300 + wind * 900);
    /* rumble: tremble + rise */
    let rum = 0;
    if (t > 23.8 && t < 28) rum = 0.05 + clamp((t - 24) / 3, 0, 1) * 0.07;
    if (t > 30.9 && t < 37.6) rum = Math.max(rum, 0.06 + clamp((t - 31) / 5, 0, 1) * 0.06);
    if (t > 38.0 && t < 41.5) rum = Math.max(rum, 0.16);
    set(L.rumble, rum, 85);
    /* engine roar */
    let eng = 0;
    if (t > 38.6 && t < 42.4) eng = clamp((t - 38.6) / 0.5, 0, 1) * 0.2 * clamp((42.4 - t) / 1.2, 0, 1);
    if (t > 42.9 && t < 46.4) eng = 0.22 * clamp((t - 42.9) / 0.3, 0, 1) * clamp((46.4 - t) / 1.6, 0, 1);
    set(L.engine, eng, 750 + eng * 2200);
    /* one-shot events */
    const EV = [
      [2.2, () => this.chirp(2400, 0.10)], [5.0, () => this.chirp(2100, 0.09)],
      [11.4, () => this.chirp(2600, 0.12)], [13.2, () => this.chirp(2300, 0.10)],
      [14.5, () => { this.chirp(2600, 0.12); setTimeout(() => this.chirp(2900, 0.10), 160); }],
      [17.4, () => this.chirp(1900, 0.06)],
      [25.3, () => { for (let i = 0; i < 5; i++) setTimeout(() => this.chirp(2200 + Math.random() * 900, 0.07), i * 90); }],
      [29.35, () => this.creak(140)], [31.1, () => this.creak(120)], [33.4, () => this.creak(105)], [35.2, () => this.creak(95)],
      [38.9, () => this.boom()],
      [42.95, () => this.whoosh()]
    ];
    for (const [et, fn] of EV) if (prevT < et && t >= et) fn();
  },
  chirp(f0, g) {
    const ctx = this.ctx; if (!ctx || !this.on) return;
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = 'sine';
    const t0 = ctx.currentTime;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.5, t0 + 0.06);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.8, t0 + 0.14);
    gn.gain.setValueAtTime(0, t0);
    gn.gain.linearRampToValueAtTime(g, t0 + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    o.connect(gn); gn.connect(this.master);
    o.start(t0); o.stop(t0 + 0.2);
  },
  creak(f) {
    const ctx = this.ctx; if (!ctx || !this.on) return;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f, t0);
    o.frequency.linearRampToValueAtTime(f * 0.6, t0 + 0.7);
    const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 500;
    gn.gain.setValueAtTime(0, t0);
    gn.gain.linearRampToValueAtTime(0.05, t0 + 0.15);
    gn.gain.linearRampToValueAtTime(0.0001, t0 + 0.85);
    o.connect(fl); fl.connect(gn); gn.connect(this.master);
    o.start(t0); o.stop(t0 + 0.9);
  },
  boom() {
    const ctx = this.ctx; if (!ctx || !this.on) return;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(65, t0);
    o.frequency.exponentialRampToValueAtTime(34, t0 + 0.9);
    gn.gain.setValueAtTime(0.4, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1);
    o.connect(gn); gn.connect(this.master);
    o.start(t0); o.stop(t0 + 1.2);
    const n = this.mkNoise(1200, 'highpass', 0);
    n.gain.gain.setValueAtTime(0.25, t0);
    n.gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    setTimeout(() => { try { n.src.stop(); } catch (e) { } }, 700);
  },
  whoosh() {
    const ctx = this.ctx; if (!ctx || !this.on) return;
    const t0 = ctx.currentTime;
    const n = this.mkNoise(300, 'bandpass', 0);
    n.filter.Q.value = 1.2;
    n.filter.frequency.setValueAtTime(220, t0);
    n.filter.frequency.exponentialRampToValueAtTime(2600, t0 + 2.6);
    n.gain.gain.setValueAtTime(0.001, t0);
    n.gain.gain.linearRampToValueAtTime(0.3, t0 + 0.9);
    n.gain.gain.linearRampToValueAtTime(0.0001, t0 + 3.2);
    setTimeout(() => { try { n.src.stop(); } catch (e) { } }, 3400);
  }
};

/* ============ main.js : bootstrap, timeline loop, UI ============ */
'use strict';

const W = 1920, H = 1080, END = 54.5;
let svg, stageEl, grainEl;
let shotGroups = [], overlayG;
let started = false, paused = false;
let masterT = 0, prevMasterT = 0;
let lastFrameTs = 0;
let grainTiles = [], grainIdx = 0, grainLastSwitch = 0;

function boot() {
  if (!document.getElementById('stage')) return; /* debug/probe pages without a stage */
  stageEl = document.getElementById('stage');
  svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'xMidYMid meet' });
  svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
  stageEl.appendChild(svg);
  DEFS = el('defs', {}, svg);
  /* blur filters */
  for (const [id, dev] of [['b2', 2], ['b4', 4], ['b8', 8], ['b10', 11], ['b14', 15]]) {
    const f = el('filter', { id, x: '-30%', y: '-30%', width: '160%', height: '160%' }, DEFS);
    el('feGaussianBlur', { stdDeviation: dev }, f);
  }
  /* the hero robot — shared across shots 4/5/6 for model consistency */
  robMain = makeRobot('rm', { detail: true });

  /* build shots in timeline order (deterministic RNG order) */
  const g1 = buildShot1();
  const g2 = buildShot2();
  const g3 = buildShot3();
  const g4 = buildShot4();
  const g5 = buildShot5();
  const g6 = buildShot6();
  const g7 = buildShot7();
  shotGroups = [g1, g2, g3, g4, g5, g6, g7];
  shotGroups.forEach((g, i) => { svg.appendChild(g); g.setAttribute('display', i === 0 ? '' : 'none'); });
  overlayG = buildOverlays();
  paintTexture(svg, DEFS);
  svg.appendChild(overlayG);

  /* grain div */
  grainEl = document.getElementById('grain');
  grainTiles = [grainDataURL(11), grainDataURL(29), grainDataURL(47)];
  grainEl.style.backgroundImage = 'url(' + grainTiles[0] + ')';

  fit();
  window.addEventListener('resize', fit);
  /* controls */
  stageEl.addEventListener('click', (e) => {
    if (e.target.closest('.ctl')) return;
    paused = !paused;
    document.getElementById('pp').textContent = paused ? '\u25B6' : '\u2759\u2759';
  });
  document.getElementById('rp').addEventListener('click', () => { masterT = 0; prevMasterT = 0; paused = false; document.getElementById('pp').textContent = '\u2759\u2759'; });
  document.getElementById('snd').addEventListener('click', (e) => {
    const ok = SoundEngine.setOn(!SoundEngine.on);
    e.currentTarget.style.opacity = ok && SoundEngine.on ? 1 : 0.55;
  });
  document.getElementById('pp').addEventListener('click', () => {
    paused = !paused;
    document.getElementById('pp').textContent = paused ? '\u25B6' : '\u2759\u2759';
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); paused = !paused; document.getElementById('pp').textContent = paused ? '\u25B6' : '\u2759\u2759'; }
  });
  /* cursor auto-hide */
  let hideTO = null;
  stageEl.addEventListener('mousemove', () => {
    stageEl.style.cursor = '';
    document.getElementById('ui').style.opacity = 1;
    clearTimeout(hideTO);
    hideTO = setTimeout(() => { stageEl.style.cursor = 'none'; document.getElementById('ui').style.opacity = 0; }, 2200);
  });

  window.__seek = function (t) {
    paused = true;
    masterT = t; prevMasterT = t;
    renderFrame(t);
  };
  window.__frame = function (t) { renderFrame(t); };
  window.__ready = true;
  requestAnimationFrame(loop);
}

function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  stageEl.style.width = fmt(W * s) + 'px';
  stageEl.style.height = fmt(H * s) + 'px';
}

function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastFrameTs) lastFrameTs = ts;
  const dt = Math.min(0.1, (ts - lastFrameTs) / 1000);
  lastFrameTs = ts;
  if (!paused && !window.__holdFrame) {
    prevMasterT = masterT;
    masterT = (masterT + dt) % END;
  }
  renderFrame(masterT);
  if (SoundEngine.ctx && SoundEngine.on) SoundEngine.update(masterT, prevMasterT);
}

function renderFrame(t) {
  /* shot visibility */
  for (let i = 0; i < SHOTS.length; i++) {
    const s = SHOTS[i];
    const on = t >= s.t0 && t < s.t1;
    const vis = s.node.getAttribute('display') !== 'none';
    if (on !== vis) s.node.setAttribute('display', on ? '' : 'none');
    if (on) s.update(t);
  }
  /* wind model */
  wind.base = 4 + Math.sin(t * 0.5) * 2;
  const gUp = clamp((t - 37.4) / 1.2, 0, 1) * clamp((42.2 - t) / 1.6, 0, 1);
  wind.gust = gUp * 1.0;
  /* sways */
  for (const s of sways) {
    const amp = s.amp * (1 + wind.gust * (s.gale ? 9 : 0.8));
    let b = Math.sin(t * s.freq * TAU + s.ph) * amp + wind.gust * (s.gale ? 62 : 6);
    const fr = Math.floor(t * 8);
    b += (hash1(fr * 3.7 + s.ph) - 0.5) * 1.2;
    b = clamp(b, -60, 60);
    if (s.node.__subs) {
      s.node.__subs.forEach((sg, i) => {
        sg.setAttribute('transform', 'translate(0 ' + fmt(s.y || 0) + ') skewX(' + fmt(-b * (1 + i * 0.22)) + ') translate(0 ' + fmt(-(s.y || 0)) + ')');
      });
    } else if (s.cx != null) {
      s.node.setAttribute('transform', 'rotate(' + fmt(b) + ' ' + fmt(s.cx) + ' ' + fmt(s.cy) + ')');
    }
  }
  /* mist drift (slow oscillation, no wrap jumps) */
  mistsDrift.forEach((m, i) => {
    m.node.setAttribute('transform', 'translate(' + fmt(Math.sin(t * 0.05 + i * 2.1) * 70) + ' 0)');
  });
  /* ray shimmer, stepped at 5fps */
  const rfr = Math.floor(t * 5);
  shimmerRays.forEach((rg, i) => {
    const v = 0.8 + 0.2 * hash1(rfr * 1.7 + i * 9.3);
    rg.setAttribute('opacity', fmt(v));
  });
  /* grain cycle at 8fps */
  if (t - grainLastSwitch > 0.125) { grainLastSwitch = t; grainIdx = (grainIdx + 1) % 3; grainEl.style.backgroundImage = 'url(' + grainTiles[grainIdx] + ')'; }
  /* global fades */
  const startF = 1 - clamp((t - 0.15) / 1.9, 0, 1);
  const endF = clamp((t - 52.4) / 1.7, 0, 1);
  overlayG.__fb.setAttribute('opacity', fmt(Math.max(startF, endF)));
}

/* boot after DOM ready */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
