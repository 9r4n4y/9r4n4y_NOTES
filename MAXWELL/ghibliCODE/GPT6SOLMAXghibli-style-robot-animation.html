<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101719">
  <title>The Forest Remembers | An Animated Scene</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101719; }
    body { font-family: Georgia, "Times New Roman", serif; color: #f0e6d0; }
    .film { position: fixed; inset: 0; overflow: hidden; background: #101719; }
    canvas { display: block; width: 100%; height: 100%; }
    .top-matte, .bottom-matte { position: absolute; left: 0; right: 0; background: #101719; z-index: 2; }
    .top-matte { top: 0; height: clamp(25px, 4.6vh, 47px); box-shadow: 0 4px 20px #10171930; }
    .bottom-matte { bottom: 0; height: clamp(51px, 7vh, 68px); box-shadow: 0 -5px 24px #10171940; }
    .film-name { position: absolute; z-index: 3; top: clamp(8px, 1.35vh, 15px); left: clamp(18px, 3.5vw, 58px); margin: 0; color: #d8d7c7; font: 500 11px/1.4 Georgia, serif; letter-spacing: .26em; text-transform: uppercase; white-space: nowrap; }
    .controls { position: absolute; z-index: 4; bottom: 0; left: 0; right: 0; height: clamp(51px, 7vh, 68px); display: flex; align-items: center; gap: clamp(15px, 2.5vw, 34px); padding: 0 clamp(18px, 3.5vw, 58px); }
    button { appearance: none; border: 0; background: transparent; color: #dadace; cursor: pointer; padding: 8px 0; font: 500 10px/1.2 Arial, sans-serif; letter-spacing: .18em; white-space: nowrap; transition: color .2s ease, opacity .2s ease; }
    button:hover, button:focus-visible { color: #f7cf85; }
    button:focus-visible, input:focus-visible { outline: 1px solid #f7cf85; outline-offset: 5px; }
    #scrub { appearance: none; -webkit-appearance: none; flex: 1; min-width: 40px; height: 20px; margin: 0; cursor: pointer; background: transparent; --progress: 0%; }
    #scrub::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(to right, #e4bb79 0%, #e4bb79 var(--progress), #68716e var(--progress), #68716e 100%); }
    #scrub::-moz-range-track { height: 2px; background: #68716e; }
    #scrub::-moz-range-progress { height: 2px; background: #e4bb79; }
    #scrub::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 7px; height: 7px; margin-top: -2.5px; border-radius: 50%; background: #f2d69f; box-shadow: 0 0 8px #f3d79280; }
    #scrub::-moz-range-thumb { width: 7px; height: 7px; border: 0; border-radius: 50%; background: #f2d69f; }
    .time { min-width: 30px; color: #9fa8a1; font: 10px/1 Arial, sans-serif; letter-spacing: .1em; text-align: right; }
    .opening-title { position: absolute; z-index: 1; left: clamp(24px, 8vw, 140px); bottom: clamp(95px, 13vh, 155px); pointer-events: none; color: #f5e9ce; text-shadow: 0 2px 13px #152122c7; font: 400 clamp(24px, 3.35vw, 53px)/1.1 Georgia, serif; letter-spacing: .055em; opacity: 0; transform: translateY(9px); transition: opacity 1.2s ease, transform 1.2s ease; }
    .opening-title.visible { opacity: .9; transform: translateY(0); }
    @media (max-width: 650px) {
      .film-name { font-size: 9px; letter-spacing: .16em; }
      .controls { gap: 12px; }
      button { font-size: 9px; letter-spacing: .07em; }
      .time { display: none; }
      .opening-title { font-size: 23px; max-width: 80vw; }
    }
  </style>
</head>
<body>
  <main class="film" aria-label="The Forest Remembers, an animated forest and robot film">
    <canvas id="stage" aria-label="An ancient moss-covered robot wakes in a sunrise forest and flies into the sky">Your browser needs canvas to play this animated scene.</canvas>
    <div class="opening-title" id="openingTitle" aria-hidden="true">The forest remembers.</div>
    <div class="top-matte" aria-hidden="true"></div>
    <h1 class="film-name">The Forest Remembers</h1>
    <div class="bottom-matte" aria-hidden="true"></div>
    <div class="controls" aria-label="Film controls">
      <button id="playButton" type="button" aria-label="Pause film">PAUSE</button>
      <input id="scrub" type="range" min="0" max="28" step="0.01" value="0" aria-label="Seek through film">
      <span class="time" id="timeLabel" aria-hidden="true">0:00</span>
      <button id="soundButton" type="button" aria-label="Turn on sound">SOUND OFF</button>
      <button id="replayButton" type="button" aria-label="Replay film">REPLAY</button>
    </div>
  </main>
  <script>
  (() => {
    'use strict';

    const W = 1600;
    const H = 900;
    const DURATION = 28;
    const INK = '#293b3d';
    const BONE = '#b8bbae';
    const LIGHT = '#d9d3b9';
    const SHADE = '#6d817d';
    const RUST = '#a56e53';
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const scrub = document.getElementById('scrub');
    const playButton = document.getElementById('playButton');
    const soundButton = document.getElementById('soundButton');
    const replayButton = document.getElementById('replayButton');
    const timeLabel = document.getElementById('timeLabel');
    const openingTitle = document.getElementById('openingTitle');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let elapsed = 0;
    let paused = reduceMotion;
    let lastFrame = performance.now();
    let lastPaint = 0;
    let size = { scale: 1, x: 0, y: 0 };

    const clamp = (n, a = 0, b = 1) => Math.max(a, Math.min(b, n));
    const mix = (a, b, t) => a + (b - a) * t;
    const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
    function random(seed) {
      let a = seed >>> 0;
      return () => {
        a += 0x6D2B79F5;
        let v = a;
        v = Math.imul(v ^ v >>> 15, v | 1);
        v ^= v + Math.imul(v ^ v >>> 7, v | 61);
        return ((v ^ v >>> 14) >>> 0) / 4294967296;
      };
    }

    function shape(g, d, fill, outline = null, width = 3) {
      const p = new Path2D(d);
      if (fill) { g.fillStyle = fill; g.fill(p); }
      if (outline) {
        g.lineJoin = 'round'; g.lineCap = 'round';
        g.strokeStyle = outline; g.lineWidth = width; g.stroke(p);
      }
      return p;
    }
    function stroke(g, d, color, width = 2, alpha = 1) {
      g.save(); g.globalAlpha *= alpha;
      shape(g, d, null, color, width);
      g.restore();
    }
    function brush(g, x, y, rx, ry, angle, color) {
      g.save(); g.translate(x, y); g.rotate(angle);
      g.fillStyle = color;
      g.beginPath();
      g.moveTo(-rx, -ry * .12);
      g.quadraticCurveTo(-rx * .48, -ry * 1.1, rx * .12, -ry * .78);
      g.lineTo(rx, -ry * .15);
      g.quadraticCurveTo(rx * .43, ry * .72, -rx * .3, ry * .85);
      g.closePath(); g.fill(); g.restore();
    }
    function roughMass(g, x, y, rx, ry, rand, color, points = 31) {
      g.fillStyle = color; g.beginPath();
      for (let i = 0; i <= points; i++) {
        const a = i / points * Math.PI * 2;
        const n = .84 + rand() * .26;
        const xx = x + Math.cos(a) * rx * n;
        const yy = y + Math.sin(a) * ry * n;
        if (i === 0) g.moveTo(xx, yy); else g.lineTo(xx, yy);
      }
      g.closePath(); g.fill();
    }
    function foliage(g, x, y, rx, ry, colors, seed, count = 130, alpha = 1) {
      const r = random(seed);
      g.save(); g.globalAlpha *= alpha;
      roughMass(g, x, y, rx, ry, r, colors[0], 37);
      for (let i = 0; i < count; i++) {
        const theta = r() * Math.PI * 2;
        const dist = Math.sqrt(r()) * .97;
        const xx = x + Math.cos(theta) * rx * dist;
        const yy = y + Math.sin(theta) * ry * dist;
        const lightSide = (xx - x) / rx * .35 - (yy - y) / ry * .5;
        let color = colors[1 + Math.floor(r() * (colors.length - 1))];
        if (lightSide > .15 && r() > .42) color = colors[colors.length - 1];
        brush(g, xx, yy, 3 + r() * rx * .075, 2 + r() * ry * .085,
          -.8 + r() * 1.6, color);
      }
      g.restore();
    }
    function watercolorSky(g) {
      const sky = g.createLinearGradient(0, 0, 130, 800);
      sky.addColorStop(0, '#839aab');
      sky.addColorStop(.29, '#aab4ae');
      sky.addColorStop(.62, '#eac6a1');
      sky.addColorStop(1, '#f6daa5');
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      const sun = g.createRadialGradient(1138, 168, 15, 1138, 168, 495);
      sun.addColorStop(0, '#fff4c9ee');
      sun.addColorStop(.16, '#ffe7adad');
      sun.addColorStop(.58, '#f9cdab49');
      sun.addColorStop(1, '#e2ba9a00');
      g.fillStyle = sun; g.fillRect(0, 0, W, H);
      const r = random(101);
      for (let i = 0; i < 365; i++) {
        const x = r() * 1700 - 50;
        const y = 45 + r() * 600;
        const w = 18 + r() * 95;
        const c = y < 300 ? ['#e6d1bc12', '#f2d5b916', '#607f9110'] : ['#fce5bc20', '#d6b8a52b', '#fcf0cd22'];
        brush(g, x, y, w, 1.5 + r() * 5, -.13 + r() * .28, c[Math.floor(r() * c.length)]);
      }
      shape(g, 'M0 405 C116 397 185 430 281 417 C370 402 454 411 523 424 C643 447 728 413 828 419 C921 422 1046 405 1167 415 C1376 424 1518 397 1600 409 L1600 474 C1371 447 1282 463 1084 449 C943 447 850 467 692 450 C489 439 325 473 0 452 Z', '#e6d5bd2a');
      for (let i = 0; i < 54; i++) {
        const x = r() * W, y = 372 + r() * 132;
        brush(g, x, y, 20 + r() * 66, 1 + r() * 4, -.1,
          r() > .5 ? '#fff3d32e' : '#667f8820');
      }
    }
    function pineSilhouette(g, x, ground, height, width, color, seed) {
      const r = random(seed);
      g.save(); g.translate(x, ground);
      g.strokeStyle = color; g.lineWidth = Math.max(2, width * .09);
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -height); g.stroke();
      g.fillStyle = color; g.beginPath(); g.moveTo(0, -height);
      for (let i = 1; i <= 14; i++) {
        const yy = -height + i * height / 14;
        const ww = width * (i / 14) * (.78 + r() * .32);
        g.lineTo(-ww, yy - 5); g.lineTo(-ww * .68, yy + 6);
      }
      g.lineTo(width * .8, 0);
      for (let i = 14; i >= 1; i--) {
        const yy = -height + i * height / 14;
        const ww = width * (i / 14) * (.78 + r() * .32);
        g.lineTo(ww * .7, yy + 5); g.lineTo(ww, yy - 6);
      }
      g.closePath(); g.fill(); g.restore();
    }
    function tree(g, x, ground, h, width, colors, seed) {
      const r = random(seed);
      g.save(); g.translate(x, ground);
      const lean = (r() - .5) * width * .4;
      const trunk = `M ${-width * .47} 24 Q ${-width * .31} ${-h * .2} ${-width * .17 + lean} ${-h * .66} L ${-width * .15 + lean} ${-h * .92} L ${width * .12 + lean} ${-h * .92} Q ${width * .13 + lean} ${-h * .51} ${width * .35} ${-h * .2} L ${width * .61} 24 L ${width * .17} 5 L ${-width * .14} 3 Z`;
      shape(g, trunk, colors.trunk, '#34463f78', 2.5);
      shape(g, `M ${width * .05} ${-h * .83} Q ${width * .12} ${-h * .37} ${width * .38} 8 L ${width * .53} 20 L ${width * .14} 1 Z`, colors.bark);
      for (let i = 0; i < 27; i++) {
        const yy = -r() * h * .9;
        const xx = (r() - .5) * width * .3 + lean * (-yy / h);
        stroke(g, `M${xx.toFixed(1)} ${yy.toFixed(1)} q${(r() - .5) * 9} ${12 + r() * 25} ${(r() - .5) * 13} ${25 + r() * 33}`,
          i % 3 ? colors.mark : colors.bark, .6 + r() * 2, .72);
      }
      for (const side of [-1, 1]) {
        for (let j = 0; j < 3; j++) {
          const by = -h * (.42 + j * .15);
          const bx = side * width * (.8 + j * .5);
          stroke(g, `M${lean * .4} ${by + 53} Q${side * width * .65} ${by - 3} ${bx} ${by - 38} Q${bx + side * width * .16} ${by - 62} ${bx + side * width * .55} ${by - 62}`,
            colors.trunk, Math.max(3, width * (.2 - j * .035)));
          stroke(g, `M${bx} ${by - 38} q${side * width * .4} -39 ${side * width * .42} -80`, colors.trunk, 3 + width * .035);
        }
      }
      foliage(g, lean, -h * .86, width * 2.05, h * .18, colors.leaves, seed + 11, 200);
      foliage(g, -width * 1.05, -h * .7, width * 1.22, h * .16, colors.leaves, seed + 29, 120);
      foliage(g, width * 1.04, -h * .69, width * 1.28, h * .17, colors.leaves, seed + 41, 125);
      foliage(g, -width * 1.37, -h * .53, width * .91, h * .12, colors.leaves, seed + 52, 85);
      foliage(g, width * 1.45, -h * .52, width * .98, h * .125, colors.leaves, seed + 62, 85);
      g.restore();
    }
    function paintGround(g, seed, details = true) {
      const r = random(seed);
      shape(g, 'M0 660 C160 638 263 674 400 653 C561 633 624 668 787 650 C988 626 1059 657 1230 637 C1398 623 1507 648 1600 627 L1600 900 L0 900 Z', '#596b57');
      shape(g, 'M0 698 Q151 665 292 700 C391 716 527 687 646 708 C819 721 878 672 1034 672 C1210 665 1304 696 1600 665 L1600 900 L0 900 Z', '#70816a');
      shape(g, 'M440 725 C610 699 784 709 910 698 C1051 686 1215 693 1431 679 L1600 691 L1600 900 L478 900 Z', '#a49b72a0');
      for (let i = 0; i < (details ? 950 : 220); i++) {
        const x = r() * 1660 - 30;
        const y = 658 + r() * 255;
        if (y < 710 && r() > .42) continue;
        const warm = x > 760 && x < 1360 && r() > .4;
        const c = warm ? ['#e1be7a55', '#b9b48683', '#e6c79555', '#6f7a626a'] : ['#354f4775', '#83907599', '#adb48a62', '#415e4d8a'];
        brush(g, x, y, 3 + r() * 22, .7 + r() * 5, -.7 + r() * 1.4, c[Math.floor(r() * c.length)]);
      }
      if (!details) return;
      for (let i = 0; i < 240; i++) {
        const x = r() * W, y = 681 + r() * 219;
        const ht = 5 + r() * 25;
        stroke(g, `M${x.toFixed(1)} ${y.toFixed(1)} q${(r() - .5) * 9} ${(-ht * .55).toFixed(1)} ${(r() - .5) * 15} ${(-ht).toFixed(1)}`,
          r() > .5 ? '#b1b79195' : '#364f4488', .7 + r() * 1.7);
      }
      for (let i = 0; i < 56; i++) {
        const x = r() * W, y = 740 + r() * 145;
        const c = r() > .4 ? '#f1ddaa' : '#a9c0b5';
        brush(g, x, y, 1.5 + r() * 3, 1 + r() * 2, r() * 2, c);
      }
    }
    function mistWash(g, seed) {
      const r = random(seed);
      for (let band = 0; band < 4; band++) {
        const y = 490 + band * 68;
        for (let i = 0; i < 75; i++) {
          const x = r() * 1800 - 100;
          brush(g, x, y + (r() - .5) * 57, 24 + r() * 105, 4 + r() * 18, -.12 + r() * .24,
            band < 2 ? '#e3e8d31d' : '#f3eed544');
        }
      }
    }
    function paintedFern(g, x, y, scale, seed) {
      const r = random(seed);
      g.save(); g.translate(x, y); g.scale(scale, scale);
      for (let stem = 0; stem < 4; stem++) {
        const direction = (stem - 1.5) * 15 + (r() - .5) * 13;
        const height = 33 + r() * 36;
        stroke(g, `M0 0 Q${direction * .28} ${-height * .54} ${direction} ${-height}`,
          '#405f4e', 1.5 + r());
        for (let i = 2; i < 9; i++) {
          const k = i / 9;
          const bx = direction * k * k;
          const by = -height * k;
          const leafSize = (1 - k) * (10 + r() * 5);
          for (const side of [-1, 1]) {
            brush(g, bx + side * leafSize * .5, by + 2, leafSize * .74, 2 + r() * 1.6,
              side * .38 + direction * .008,
              r() > .5 ? '#73916b' : '#a3ad79');
          }
        }
      }
      g.restore();
    }
    function paintedStone(g, x, y, w, h, seed) {
      const r = random(seed);
      roughMass(g, x, y, w, h, r, '#485b52', 13);
      roughMass(g, x - w * .1, y - h * .23, w * .76, h * .54, r, '#929b83', 12);
      for (let i = 0; i < 35; i++) {
        brush(g, x + (r() - .5) * w * 1.7, y + (r() - .5) * h * 1.2,
          2 + r() * 10, .7 + r() * 3, r() * 3,
          r() > .42 ? '#a9ac88' : '#42654d');
      }
      foliage(g, x - w * .38, y - h * .45, w * .38, h * .19,
        ['#385f4b', '#547858', '#758c62', '#91a16d', '#b6b982'], seed + 3, 28, .83);
    }
    function makeLayer(painter) {
      const layer = document.createElement('canvas');
      layer.width = W; layer.height = H;
      painter(layer.getContext('2d'));
      return layer;
    }
    const forest = makeLayer(g => {
      watercolorSky(g);
      shape(g, 'M0 535 C116 511 172 535 281 501 C393 465 478 518 565 495 C674 464 751 496 860 480 C999 467 1029 493 1135 474 C1280 451 1423 480 1600 451 L1600 713 L0 713 Z', '#8b9b96a8');
      shape(g, 'M0 592 C108 568 174 584 242 559 C354 525 424 567 515 542 C667 513 780 550 892 533 C1015 517 1119 555 1233 526 C1388 489 1494 521 1600 507 L1600 731 L0 731 Z', '#6b8580b8');
      const r = random(77);
      for (let i = 0; i < 72; i++) {
        const x = -35 + i * 24 + (r() - .5) * 35;
        pineSilhouette(g, x, 691 + r() * 31, 72 + r() * 198, 10 + r() * 32,
          ['#536d66b0', '#637b70bd', '#7a8c7bb8'][Math.floor(r() * 3)], 110 + i);
      }
      paintGround(g, 712);
      tree(g, 130, 742, 700, 86, {
        trunk: '#3f554e', bark: '#647568', mark: '#a1a78a80',
        leaves: ['#354e46', '#476653', '#5f775a', '#76906b', '#9ca680']
      }, 310);
      tree(g, 1485, 749, 736, 96, {
        trunk: '#42564d', bark: '#647361', mark: '#a8a9877d',
        leaves: ['#365247', '#4f6b56', '#65815f', '#87936c', '#bbc090']
      }, 450);
      tree(g, 399, 706, 405, 43, {
        trunk: '#54695b', bark: '#778371', mark: '#bdba9880',
        leaves: ['#486b58', '#648169', '#789675', '#9dad83', '#bbc599']
      }, 519);
      tree(g, 1286, 684, 400, 46, {
        trunk: '#647465', bark: '#909378', mark: '#b9b393a0',
        leaves: ['#57735e', '#76866b', '#93a07b', '#b2ae83', '#d3c591']
      }, 561);
      shape(g, 'M-25 809 C92 783 190 795 304 818 L367 842 L353 863 L156 837 L-25 854 Z', '#4b5948');
      shape(g, 'M-25 812 C94 791 192 801 304 823 L344 843 L206 822 L-25 832 Z', '#869073');
      stroke(g, 'M37 826 Q132 812 258 834 M94 833 l46 5 M206 841 l50 6', '#334e42', 2);
      for (const [x, y, w, h, seed] of [[296, 772, 37, 21, 621], [1197, 797, 48, 26, 622],
        [1341, 759, 30, 18, 623], [430, 846, 27, 17, 624], [1459, 840, 42, 22, 625]]) {
        paintedStone(g, x, y, w, h, seed);
      }
      for (let i = 0; i < 19; i++) {
        const x = i < 8 ? 54 + i * 48 : 1110 + (i - 8) * 46;
        const y = 738 + (i * 39) % 146;
        paintedFern(g, x, y, .58 + (i * 7 % 11) * .085, 1500 + i);
      }
      mistWash(g, 614);
      const paint = random(921);
      for (let i = 0; i < 420; i++) {
        const x = paint() * W, y = 80 + paint() * 820;
        brush(g, x, y, 1 + paint() * 4, .35 + paint() * 1.2, paint() * 3,
          paint() > .5 ? '#fff2c822' : '#233f4016');
      }
    });
    const foreground = makeLayer(g => {
      const r = random(380);
      shape(g, 'M0 0 L75 0 C57 122 88 241 61 337 C41 455 72 570 0 681 Z', '#293f3b99');
      shape(g, 'M1600 0 L1547 0 C1525 126 1530 238 1556 348 C1582 483 1560 559 1600 624 Z', '#2e48419a');
      stroke(g, 'M0 102 C171 93 196 169 268 195 C330 218 370 215 411 234', '#394c40', 21);
      stroke(g, 'M1600 118 C1485 112 1406 166 1327 196 C1278 211 1244 201 1204 219', '#3c5144', 19);
      foliage(g, 1, 90, 220, 121, ['#25413b', '#345a48', '#487153', '#66815c', '#91a076'], 701, 190, .94);
      foliage(g, 1650, 88, 231, 124, ['#2a463e', '#3f604a', '#58765a', '#7e9068', '#a2a978'], 722, 190, .96);
      foliage(g, -53, 463, 114, 257, ['#29433d', '#385847', '#55725a', '#718469', '#9aaa7b'], 724, 120, .88);
      foliage(g, 1665, 478, 110, 266, ['#304a40', '#45644e', '#62805b', '#8c9369', '#acac7a'], 736, 120, .86);
      for (let i = 0; i < 200; i++) {
        const edge = r() > .5;
        const x = edge ? 1180 + r() * 480 : r() * 440;
        const y = 789 + r() * 128;
        const h = 14 + r() * 66;
        stroke(g, `M${x.toFixed(1)} ${y.toFixed(1)} Q${(x + (r() - .5) * 22).toFixed(1)} ${(y - h * .6).toFixed(1)} ${(x + (r() - .5) * 43).toFixed(1)} ${(y - h).toFixed(1)}`,
          r() > .5 ? '#2d4e40' : '#899b6b', .7 + r() * 2.6, .8);
      }
      for (let i = 0; i < 19; i++) {

      ctx.fillStyle = grainPattern; ctx.fillRect(0, 0, W, H);
      ctx.restore();
      // The final breath of the shot is held in the sky before the loop goes dark.
      if (t > 26.3) {
        ctx.fillStyle = `rgba(13, 23, 25, ${ease((t - 26.3) / 1.7)})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    // Web Audio is intentionally optional: browsers only permit it after a gesture.
    class Soundscape {
      constructor() { this.context = null; this.master = null; this.enabled = false; this.fired = new Set(); }
      start() {
        if (!this.context) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return false;
          this.context = new AudioContext();
          this.master = this.context.createGain();
          this.master.gain.value = .35;
          this.master.connect(this.context.destination);
          this.ambient();
        }
        this.context.resume();
        this.master.gain.setTargetAtTime(.35, this.context.currentTime, .12);
        this.enabled = true;
        this.fired.clear();
        return true;
      }
      stop() {
        if (this.context) this.master.gain.setTargetAtTime(0, this.context.currentTime, .1);
        this.enabled = false;
      }
      ambient() {
        const c = this.context;
        const buffer = c.createBuffer(1, c.sampleRate * 3, c.sampleRate);
        const data = buffer.getChannelData(0);
        const r = random(8934);
        for (let i = 0; i < data.length; i++) data[i] = (r() * 2 - 1) * .18;
        const source = c.createBufferSource(); source.buffer = buffer; source.loop = true;
        const filter = c.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 420;
        const gain = c.createGain(); gain.gain.value = .17;
        source.connect(filter); filter.connect(gain); gain.connect(this.master);
        source.start();
      }
      tone(from, to, duration, volume, type = 'sine', delay = 0) {
        const c = this.context, now = c.currentTime + delay;
        const o = c.createOscillator(), gain = c.createGain();
        o.type = type;
        o.frequency.setValueAtTime(from, now);
        o.frequency.exponentialRampToValueAtTime(Math.max(20, to), now + duration);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + Math.min(.11, duration * .18));
        gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
        o.connect(gain); gain.connect(this.master);
        o.start(now); o.stop(now + duration + .03);
      }
      noise(duration, volume, frequency, delay = 0) {
        const c = this.context, now = c.currentTime + delay;
        const buffer = c.createBuffer(1, Math.ceil(c.sampleRate * duration), c.sampleRate);
        const data = buffer.getChannelData(0);
        const r = random(Math.floor(now * 10000));
        for (let i = 0; i < data.length; i++) data[i] = r() * 2 - 1;
        const source = c.createBufferSource(); source.buffer = buffer;
        const filter = c.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = frequency;
        const gain = c.createGain(); gain.gain.setValueAtTime(.0001, now);
        gain.gain.linearRampToValueAtTime(volume, now + duration * .24);
        gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
        source.connect(filter); filter.connect(gain); gain.connect(this.master);
        source.start(now); source.stop(now + duration + .03);
      }
      event(name) {
        if (!this.enabled || this.fired.has(name)) return;
        this.fired.add(name);
        if (name === 'bird') {
          for (let i = 0; i < 3; i++) this.tone(780 + i * 130, 1330 + i * 120, .16, .12, 'sine', i * .14);
        } else if (name === 'heart') {
          this.tone(75, 45, .8, .19, 'sine');
          this.tone(310, 430, 1.5, .075, 'sine', .16);
        } else if (name === 'birds') {
          for (let i = 0; i < 11; i++) this.tone(710 + i * 47, 1250 + i * 19, .14, .045, 'sine', i * .07);
          this.noise(1.9, .22, 1150);
        } else if (name === 'rise') {
          this.tone(77, 33, 5.5, .32, 'sawtooth');
          this.tone(135, 52, 4.8, .11, 'triangle', .4);
          this.noise(4.8, .23, 360);
        } else if (name === 'engine') {
          this.tone(46, 174, 3.1, .27, 'sawtooth');
          this.noise(3.1, .33, 630);
        } else if (name === 'launch') {
          this.tone(85, 410, 2.8, .4, 'sawtooth');
          this.noise(4.2, .47, 2000);
          this.tone(280, 115, 5.2, .12, 'sine', .2);
        }
      }
    }
    const sound = new Soundscape();
    const cues = [[1.72, 'bird'], [6.54, 'heart'], [8.9, 'birds'], [10.1, 'rise'], [16.3, 'engine'], [19.18, 'launch']];
    function cueSounds(before, after) {
      if (after < before) sound.fired.clear();
      for (const [at, name] of cues) {
        if ((after < before ? at > before || at <= after : at > before && at <= after)) sound.event(name);
      }
    }
    function updateControls() {
      scrub.value = elapsed.toFixed(2);
      scrub.style.setProperty('--progress', `${elapsed / DURATION * 100}%`);
      timeLabel.textContent = `0:${String(Math.floor(elapsed)).padStart(2, '0')}`;
      openingTitle.classList.toggle('visible', elapsed > .7 && elapsed < 3.45);
    }
    function seek(value) {
      elapsed = clamp(Number(value), 0, DURATION - .01);
      sound.fired.clear();
      updateControls(); render(elapsed);
    }
    playButton.addEventListener('click', () => {
      paused = !paused;
      playButton.textContent = paused ? 'PLAY' : 'PAUSE';
      playButton.setAttribute('aria-label', paused ? 'Play film' : 'Pause film');
    });
    soundButton.addEventListener('click', () => {
      if (sound.enabled) sound.stop(); else sound.start();
      soundButton.textContent = sound.enabled ? 'SOUND ON' : 'SOUND OFF';
      soundButton.setAttribute('aria-label', sound.enabled ? 'Turn off sound' : 'Turn on sound');
    });
    replayButton.addEventListener('click', () => {
      seek(0); paused = false; playButton.textContent = 'PAUSE';
      playButton.setAttribute('aria-label', 'Pause film');
    });
    scrub.addEventListener('input', e => seek(e.target.value));
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target !== scrub && e.target.tagName !== 'BUTTON') {
        e.preventDefault(); playButton.click();
      }
    });
    window.addEventListener('resize', resize, { passive: true });
    function animate(now) {
      const dt = Math.min((now - lastFrame) / 1000, .08);
      lastFrame = now;
      if (!paused) {
        const before = elapsed;
        elapsed = (elapsed + dt) % DURATION;
        cueSounds(before, elapsed);
      }
      if (!paused && now - lastPaint > 1000 / 24) {
        render(elapsed); updateControls(); lastPaint = now;
      }
      requestAnimationFrame(animate);
    }
    if (paused) { playButton.textContent = 'PLAY'; playButton.setAttribute('aria-label', 'Play film'); }
    resize(); updateControls(); requestAnimationFrame(animate);
  })();
  </script>
