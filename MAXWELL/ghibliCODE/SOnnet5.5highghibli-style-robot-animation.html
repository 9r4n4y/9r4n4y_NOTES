<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>目覚めの森 — The Waking</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#050607;overflow:hidden;font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas#c{width:min(100vw,calc(100vh*1600/670));aspect-ratio:1600/670;display:block;background:#000}
#start{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 60% 40%,#2c4a4a 0%,#101c20 70%,#06090b 100%);transition:opacity 1.2s}
#bar{position:fixed;left:0;right:0;bottom:0;height:14px;cursor:pointer;z-index:5;opacity:.0;transition:opacity .4s}
#bar:hover{opacity:1}
#bar i{display:block;height:3px;margin-top:11px;background:#ffd98a;width:0}
#snd{position:fixed;right:14px;top:12px;z-index:6;color:#fff;opacity:.35;font-size:12px;cursor:pointer;letter-spacing:.1em;font-family:sans-serif}
#snd:hover{opacity:.9}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1600" height="670"></canvas></div>
<div id="bar"><i id="barI"></i></div>
<div id="snd">SOUND ON</div>
<div id="start" class="flex flex-col items-center justify-center text-center">
  <div class="text-amber-100/70 tracking-[0.5em] text-xs mb-6">A SHORT FILM</div>
  <h1 class="text-amber-50 text-6xl md:text-8xl font-semibold" style="letter-spacing:.25em;text-shadow:0 0 40px rgba(255,214,140,.35)">目覚めの森</h1>
  <div class="text-amber-100/80 tracking-[0.35em] mt-4 text-sm md:text-base">THE WAKING OF THE FOREST GUARDIAN</div>
  <div id="status" class="text-emerald-100/60 mt-14 text-sm tracking-widest">painting the backgrounds…</div>
  <button id="go" class="mt-6 px-10 py-3 border border-amber-100/60 text-amber-50 tracking-[0.4em] text-sm hidden hover:bg-amber-100/10 transition cursor-pointer">はじめる ・ BEGIN</button>
  <div class="text-white/30 text-xs mt-10 tracking-wider">sound recommended · ← → to seek · click the bottom edge to scrub</div>
</div>
<script>
'use strict';
/* =====================================================================
   PART 1 — utilities and painted backgrounds (gouache-style, procedural)
   ===================================================================== */
const W=1600,H=670,GY=220;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=mulberry32(7);
function seedR(s){R=mulberry32(s);}
const rnd=(a,b)=>a+(b-a)*R();
const pick=a=>a[(R()*a.length)|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function parse(c){
  if(Array.isArray(c))return c;
  if(c[0]==='#')return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const m=c.match(/[\d.]+/g);return [+m[0],+m[1],+m[2]];
}
function mix(a,b,t){a=parse(a);b=parse(b);return 'rgb('+((a[0]+(b[0]-a[0])*t)|0)+','+((a[1]+(b[1]-a[1])*t)|0)+','+((a[2]+(b[2]-a[2])*t)|0)+')';}
function rgba(c,a){c=parse(c);return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}

const LAY={};
function mkLayer(x0,y0,x1,y1,rs){
  const c=document.createElement('canvas');c.width=Math.ceil((x1-x0)*rs);c.height=Math.ceil((y1-y0)*rs);
  const g=c.getContext('2d');g.scale(rs,rs);g.translate(-x0,-y0);
  return {c,g,x0,y0,w:x1-x0,h:y1-y0};
}
function mkSprite(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c;}
const PAL=d=>[mix('#14302f','#7f98ac',d),mix('#245046','#93b2b6',d),mix('#40774a','#a4c3b0',d),mix('#85b358','#c1d6a2',d),mix('#d9de8a','#ecebb5',d)];
const DARKPAL=['#0a1c20','#12302f','#215540','#4f9047','#bfd666'];
const MOSSPAL=['#1d4a3c','#2f6a45','#4f8f46','#8fbd55','#d4e07a'];

function dab(g,x,y,rx,ry,rot,fill,a){g.globalAlpha=a;g.fillStyle=fill;g.beginPath();g.ellipse(x,y,rx,ry,rot,0,6.2832);g.fill();g.globalAlpha=1;}
function leafP(g,x,y,len,wid,ang,fill){
  g.save();g.translate(x,y);g.rotate(ang);g.fillStyle=fill;g.beginPath();g.moveTo(0,0);
  g.quadraticCurveTo(len*0.5,-wid,len,0);g.quadraticCurveTo(len*0.5,wid*0.8,0,0);g.fill();g.restore();
}
function bladeP(g,x,y,h,lean,wd,col){
  g.fillStyle=col;g.beginPath();g.moveTo(x-wd,y);
  g.quadraticCurveTo(x+lean*0.25-wd*0.3,y-h*0.6,x+lean,y-h);
  g.quadraticCurveTo(x+lean*0.3+wd*0.5,y-h*0.5,x+wd,y);g.closePath();g.fill();
}
function flowerP(g,x,y,r,col,cen){
  const o=R()*6;
  for(let i=0;i<5;i++){const a=o+i*1.2566;dab(g,x+Math.cos(a)*r*0.75,y+Math.sin(a)*r*0.75,r*0.7,r*0.5,a,col,1);}
  dab(g,x,y,r*0.45,r*0.45,0,cen,1);
}

function foliage(g,cx,cy,rx,ry,pal,o){
  o=o||{};
  const sun=o.sun||[0.62,-0.78];
  const n=o.n||Math.max(24,(rx*ry/(o.dens||42))|0);
  const ls=o.ls||Math.max(3.5,Math.min(rx,ry)*0.15);
  g.globalAlpha=1;g.fillStyle=pal[0];
  g.beginPath();g.ellipse(cx,cy,rx*0.93,ry*0.93,0,0,6.2832);g.fill();
  const L=[];
  for(let i=0;i<n;i++){
    const a=R()*6.2832,d=Math.sqrt(R());
    const nx=Math.cos(a)*d,ny=Math.sin(a)*d;
    const l=(nx*sun[0]+ny*sun[1])*0.58+0.24+(R()-0.5)*0.42+(o.bright||0);
    const idx=l<0.04?0:l<0.30?1:l<0.56?2:l<0.80?3:4;
    L.push({x:cx+nx*rx,y:cy+ny*ry,idx:idx,s:ls*(0.7+R()*0.8),r:(R()-0.5)*1.6});
  }
  L.sort((a,b)=>a.idx-b.idx);
  for(const p of L){g.fillStyle=pal[p.idx];g.beginPath();g.ellipse(p.x,p.y,p.s,p.s*(0.55+R()*0.3),p.r,0,6.2832);g.fill();}
  g.lineCap='round';
  const nb=(n/5)|0;
  for(let i=0;i<nb;i++){
    const a=R()*6.2832,d=Math.sqrt(R());const x=cx+Math.cos(a)*d*rx,y=cy+Math.sin(a)*d*ry;
    g.strokeStyle=R()<0.5?pal[1+((R()*4)|0)]:pal[0];g.globalAlpha=0.33;g.lineWidth=Math.max(0.8,ls*0.16);
    const an=-0.9+R()*1.0;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(an)*ls*1.5,y+Math.sin(an)*ls*0.9);g.stroke();
  }
  g.globalAlpha=1;
}
function crown(g,cx,cy,r,pal,o){
  o=o||{};const k=o.k||7,items=[];
  for(let i=0;i<k;i++){
    const a=R()*6.2832,d=Math.sqrt(R());
    items.push({x:cx+Math.cos(a)*d*r*1.05,y:cy+Math.sin(a)*d*r*0.6,r:r*(0.36+R()*0.24)});
  }
  items.sort((a,b)=>b.y-a.y);
  for(const it of items)foliage(g,it.x,it.y,it.r*1.15,it.r*0.82,pal,{ls:o.ls||it.r*0.13,sun:o.sun,bright:o.bright,dens:o.dens});
}
function cloud(g,x,y,w,pal){
  g.save();g.beginPath();g.rect(x-w*1.6,y-w*1.2,w*3.2,w*1.2+w*0.2);g.clip();
  for(let k=0;k<5;k++)foliage(g,x+(R()-0.5)*w,y+(R()-0.55)*w*0.22,w*(0.26+R()*0.22),w*(0.13+R()*0.12),pal,{ls:w*0.045,sun:[0.7,-0.6],dens:30});
  g.restore();
}
function haze(g,x0,y0,x1,y1,yA,yB,col,aA,aB){
  g.save();g.globalCompositeOperation='source-atop';
  const gr=g.createLinearGradient(0,yA,0,yB);gr.addColorStop(0,rgba(col,aA));gr.addColorStop(1,rgba(col,aB));
  g.fillStyle=gr;g.fillRect(x0,y0,x1-x0,y1-y0);g.restore();
}
function glowIn(g,x,y,r,col,a){
  g.save();g.globalCompositeOperation='source-atop';
  const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(col,a));gr.addColorStop(1,rgba(col,0));
  g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore();
}

function trunk(g,x,yb,yt,wb,wt,d,o){
  o=o||{};
  const bark=[mix('#2a2a30','#8aa0b0',d),mix('#4a4038','#a2b0b6',d),mix('#7d6c54','#b9bfb0',d),mix('#d2ad6c','#e8dcae',d)];
  const N=16,Lf=[],Rt=[],sd=R()*10,bend=o.bend||0;
  for(let i=0;i<=N;i++){
    const t=i/N,y=yb+(yt-yb)*t,w=wb+(wt-wb)*Math.pow(t,0.7),fl=wb*0.6*Math.exp(-t*13);
    const cx=x+Math.sin(t*2.4+sd)*bend*t+(R()-0.5)*2;
    Lf.push([cx-w/2-fl-(R()-0.5)*3,y]);Rt.push([cx+w/2+fl+(R()-0.5)*3,y]);
  }
  const path=()=>{g.beginPath();g.moveTo(Lf[0][0],Lf[0][1]);for(let i=1;i<=N;i++)g.lineTo(Lf[i][0],Lf[i][1]);for(let i=N;i>=0;i--)g.lineTo(Rt[i][0],Rt[i][1]);g.closePath();};
  path();g.fillStyle=bark[1];g.fill();
  g.save();path();g.clip();
  const gr=g.createLinearGradient(x-wb*0.8,0,x+wb*0.8,0);
  gr.addColorStop(0,bark[0]);gr.addColorStop(0.45,bark[1]);gr.addColorStop(0.82,bark[2]);gr.addColorStop(1,bark[3]);
  g.fillStyle=gr;g.fillRect(x-wb*2,yt,wb*4,yb-yt+30);
  g.lineCap='round';
  const ns=Math.floor(Math.abs(yb-yt)/9);
  for(let i=0;i<ns;i++){
    const t=R(),y=yb+(yt-yb)*t,w=wb+(wt-wb)*Math.pow(t,0.7),xx=x+(R()-0.5)*w*0.95;
    g.globalAlpha=0.3;g.strokeStyle=R()<0.55?bark[0]:bark[3];g.lineWidth=rnd(1,w*0.05+1.5);
    g.beginPath();g.moveTo(xx,y);g.quadraticCurveTo(xx+rnd(-5,5),y-40,xx+rnd(-4,4),y-rnd(40,130));g.stroke();
  }
  for(let i=0;i<ns/2;i++){
    const t=R(),y=yb+(yt-yb)*t,w=wb+(wt-wb)*Math.pow(t,0.7);
    dab(g,x+w*rnd(0.15,0.45),y,rnd(3,w*0.12+3),rnd(8,22),0,'#ffd98a',0.16);
  }
  g.globalAlpha=1;g.restore();
  const base=yb+4;
  if(o.moss!==0){
    const mp=o.pal||MOSSPAL;
    for(let i=0;i<(o.mossN||6);i++){
      const t=Math.pow(R(),1.6)*0.5,y=yb+(yt-yb)*t,w=wb+(wt-wb)*Math.pow(t,0.7);
      foliage(g,x-w*rnd(0.1,0.5),y,w*rnd(0.2,0.4),rnd(18,40),mp.map(c=>mix(c,'#8fa8b0',d*0.8)),{ls:4});
    }
  }
}
function rootsP(g,x,y,w,d){
  const c=mix('#3b3330','#97a5aa',d);
  for(let i=0;i<5;i++){
    const s=(i-2)/2,dx=s*w*1.3;
    g.fillStyle=i%2?mix('#54483c','#a5b0ae',d):c;
    g.beginPath();g.moveTo(x+s*w*0.3-14,y-50);g.quadraticCurveTo(x+dx*0.6,y-10,x+dx*1.2,y+6);
    g.quadraticCurveTo(x+dx*0.8,y-12,x+s*w*0.3+14,y-50);g.fill();
  }
}
function vineStrand(g,x,y,len,pal,thick){
  g.strokeStyle=pal[1];g.lineWidth=thick;g.lineCap='round';g.beginPath();g.moveTo(x,y);
  let px=x;const pts=[];
  for(let i=1;i<=12;i++){px+=Math.sin(i*0.6+x)*2.5+rnd(-1.5,1.5);const py=y+len*i/12;g.lineTo(px,py);pts.push([px,py]);}
  g.stroke();
  for(const p of pts)if(R()<0.75)leafP(g,p[0],p[1],rnd(12,24),rnd(5,9),rnd(0.4,2.7),pick([pal[2],pal[3],pal[1],pal[2]]));
}

/* --- sprites: tufts, ferns, saplings, leaves, puffs --- */
const SPR={};
function fernFrond(g,x,y,ang,len,cols,sc){
  const pts=[];
  for(let i=0;i<=12;i++){const t=i/12;pts.push([x+Math.sin(ang)*t*len+Math.sin(ang)*t*t*len*0.1,y-Math.cos(ang)*t*len*0.9+t*t*len*0.35+(ang>0?0:0)]);}
  g.strokeStyle=cols[1];g.lineWidth=2*sc;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const p of pts)g.lineTo(p[0],p[1]);g.stroke();
  for(let i=2;i<=12;i++){
    const p=pts[i],t=i/12,q=pts[i-1],da=Math.atan2(p[1]-q[1],p[0]-q[0]),ll=len*0.3*(1-t*0.7);
    for(const sgn of [-1,1])leafP(g,p[0],p[1],ll,ll*0.28,da+sgn*1.0,cols[(sgn>0?2:1)+(R()<0.3?1:0)]);
  }
}
function tuftSprite(kind,seed){
  seedR(seed);
  return mkSprite(130,120,(g,w,h)=>{
    const cx=65,by=114;
    const cols=['#1d4638','#2f6a43','#4f8f48','#86b857','#c9da6c'];
    if(kind===2){
      for(let i=0;i<6;i++)fernFrond(g,cx+rnd(-8,8),by,-1.25+i*0.5+rnd(-.1,.1),rnd(60,92),cols,1);
      return;
    }
    const nb=kind===3?18:30,B=[];
    for(let i=0;i<nb;i++){
      const x=cx+rnd(-28,28),hh=rnd(34,98)*(1-Math.abs(x-cx)/90);
      B.push({x:x,h:hh,l:(x-cx)*0.7+rnd(-12,12),w:rnd(2,3.8),c:Math.min(4,Math.floor(rnd(0,3)+(hh/98)*1.8))});
    }
    B.sort((a,b)=>a.c-b.c);
    for(const b of B)bladeP(g,b.x,by,b.h,b.l,b.w,cols[b.c]);
    if(kind===1||kind===3){
      const fc=['#fff7e2','#ffe27a','#d0c0ff','#ffb8c8','#ffffff'];
      const nf=kind===3?12:7,col=pick(fc);
      for(let i=0;i<nf;i++){
        const fx=cx+rnd(-30,30),fy=by-rnd(22,kind===3?62:84);
        g.strokeStyle='#3f7a45';g.lineWidth=1.5;g.beginPath();g.moveTo(fx*0.3+cx*0.7,by);g.lineTo(fx,fy);g.stroke();
        flowerP(g,fx,fy,rnd(3.5,6),R()<0.7?col:pick(fc),'#f2b03a');
      }
    }
  });
}
function saplingSprite(){
  seedR(901);
  return mkSprite(190,300,(g,w,h)=>{
    const pts=[[95,296],[92,250],[100,200],[92,150],[96,110]];
    g.lineCap='round';g.lineJoin='round';
    const pal=PAL(0.02);
    const drawT=(wd,col)=>{g.strokeStyle=col;g.lineWidth=wd;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.quadraticCurveTo(pts[i-1][0]+(i%2?8:-8),(pts[i-1][1]+pts[i][1])/2,pts[i][0],pts[i][1]);g.stroke();};
    drawT(16,'#2e2824');drawT(12,'#5a4a3c');drawT(5,'#a88c5c');
    g.strokeStyle='#4a3c30';g.lineWidth=5;g.beginPath();g.moveTo(94,190);g.quadraticCurveTo(60,170,40,130);g.stroke();
    g.beginPath();g.moveTo(98,150);g.quadraticCurveTo(130,130,150,96);g.stroke();
    foliage(g,45,118,34,26,pal,{ls:5});foliage(g,150,90,38,28,pal,{ls:5});
    foliage(g,95,76,60,48,pal,{ls:6});foliage(g,70,50,36,28,pal,{ls:5,bright:0.1});foliage(g,122,48,34,26,pal,{ls:5,bright:0.12});
  });
}
function leafSprite(c1,c2,c3){
  return mkSprite(44,26,(g)=>{
    g.translate(4,13);
    const path=()=>{g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(18,-13,36,0);g.quadraticCurveTo(18,11,0,0);};
    path();g.fillStyle=c1;g.fill();g.save();path();g.clip();
    g.fillStyle=c2;g.beginPath();g.rect(-2,-14,44,14);g.fill();
    g.fillStyle=c3;g.beginPath();g.ellipse(26,-6,12,4,-0.2,0,6.28);g.fill();g.restore();
    g.strokeStyle='rgba(30,40,20,.55)';g.lineWidth=1;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(18,-1,34,0);g.stroke();
  });
}
function circlesPath(g,L,ox,oy){for(const c of L){g.moveTo(c[0]+ox+c[2],c[1]+oy);g.arc(c[0]+ox,c[1]+oy,c[2],0,6.2832);}}
function puffSprite(seed,cols,outline){
  seedR(seed);
  return mkSprite(220,170,(g,w,h)=>{
    const L=[],cx=110,cy=88,n=7;
    for(let i=0;i<n;i++){const a=i/n*6.2832+R()*0.6,d=i===0?0:rnd(28,50);L.push([cx+Math.cos(a)*d*1.2,cy+Math.sin(a)*d*0.85,rnd(26,44)]);}
    L.push([cx,cy,48]);
    g.beginPath();circlesPath(g,L,0,0);g.lineWidth=5;g.lineJoin='round';g.strokeStyle=outline;g.stroke();g.fillStyle=cols[0];g.fill();
    g.save();g.beginPath();circlesPath(g,L,0,0);g.clip();
    g.beginPath();circlesPath(g,L,10,-9);g.fillStyle=cols[1];g.fill();
    g.beginPath();circlesPath(g,L,0,0);circlesPath(g,L,-7,6);g.fillStyle=cols[2];g.fill('evenodd');
    g.restore();
    g.beginPath();circlesPath(g,L,0,0);g.lineWidth=1.6;g.strokeStyle=outline;g.stroke();
  });
}

/* --- painters --- */
function paintSky(){
  seedR(11);
  const L=mkLayer(-1400,-1500,1400,700,0.6),g=L.g;
  const gr=g.createLinearGradient(0,-1500,0,700);
  [[0,'#4a7cab'],[0.27,'#7db0cc'],[0.455,'#bfe0dc'],[0.568,'#ffeeb8'],[0.68,'#ffd58a'],[0.795,'#ffbf8a'],[1,'#f0a38f']].forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr;g.fillRect(-1400,-1500,2800,2200);
  const rg=g.createRadialGradient(360,-50,0,360,-50,900);
  rg.addColorStop(0,'rgba(255,252,225,1)');rg.addColorStop(0.12,'rgba(255,238,180,.85)');rg.addColorStop(0.4,'rgba(255,214,140,.35)');rg.addColorStop(1,'rgba(255,200,130,0)');
  g.fillStyle=rg;g.fillRect(-1400,-1500,2800,2200);
  g.lineCap='round';
  for(let i=0;i<900;i++){
    const x=rnd(-1400,1400),y=rnd(-1400,600),len=rnd(60,260),t=(y+1500)/2200;
    g.globalAlpha=rnd(0.04,0.12);g.strokeStyle=R()<0.5?'#fff3d0':(t<0.5?'#5f95bd':'#ffb98a');g.lineWidth=rnd(6,22);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+len,y+rnd(-6,6));g.stroke();
  }
  g.globalAlpha=1;
  const warm=['#a99bc6','#e4a9ae','#ffcfa0','#fff0cc','#fffdf0'],cool=['#8c9fc4','#bcc7de','#dbe3ee','#f2f2f0','#fffef6'];
  for(let i=0;i<40;i++){const y=rnd(-900,170);cloud(g,rnd(-1300,1300),y,rnd(160,430),y<-480?cool:warm);}
  LAY.sky=L;
}
function treeBand(g,d,baseY,x0,x1,step,rmin,rmax,jit,fillTo){
  const pal=PAL(d);

function drawMist(img,f,yRef,cam,t,speed,alpha,sc,xo){

const Aud={ac:null,muted:false,mus:null,
  init(){
    try{
      const ac=this.ac=new (window.AudioContext||window.webkitAudioContext)();
      this.master=ac.createGain();this.master.gain.value=0.9;this.master.connect(ac.destination);
      const b=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;
      const s=ac.createBufferSource();s.buffer=b;s.loop=true;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=480;
      const g=ac.createGain();g.gain.value=0.05;s.connect(lp);lp.connect(g);g.connect(this.master);s.start();this.wind=g;this.windLP=lp;
      const lfo=ac.createOscillator();lfo.frequency.value=0.11;const lg=ac.createGain();lg.gain.value=0.025;lfo.connect(lg);lg.connect(g.gain);lfo.start();
    }catch(e){this.ac=null;}
  },
  noise(dur,ftype,f0,f1,v,delay,q){
    if(!this.ac)return;const ac=this.ac,t0=ac.currentTime+(delay||0);
    const s=ac.createBufferSource();s.buffer=this.nb;const f=ac.createBiquadFilter();f.type=ftype;f.Q.value=q||1;
    f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+dur*0.25);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t0,Math.random()*2);s.stop(t0+dur+0.1);
  },
  tone(f0,f1,dur,v,type,delay,dest,att){
    if(!this.ac)return;const ac=this.ac,t0=ac.currentTime+(delay||0);
    const o=ac.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t0);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+(att||dur*0.12));g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(dest||this.master);o.start(t0);o.stop(t0+dur+0.1);
  },
  chirp(){
    if(!this.ac||this.muted)return;const base=2400+Math.random()*1800,n=2+((Math.random()*4)|0);
    for(let i=0;i<n;i++)this.tone(base,base*(1.2+Math.random()*0.4),0.09,0.025,'sine',i*0.12);
  },
  ev(name){
    if(!this.ac)return;
    if(name==='rumble'){this.noise(6,'lowpass',70,120,0.55,0,0.7);this.tone(38,30,6,0.12,'sine',0);}
    else if(name==='flush'){for(let i=0;i<14;i++)this.tone(2600+Math.random()*2200,3600+Math.random()*2000,0.12,0.03,'sine',Math.random()*0.8);this.noise(1.2,'bandpass',900,2600,0.08,0,0.8);}
    else if(name==='eyeOn'){this.tone(110,330,2.4,0.05,'triangle',0);this.tone(220,440,2.4,0.03,'sine',0.3);}
    else if(name==='creak'){this.tone(52,76,1.7,0.07,'sawtooth',0);this.noise(1.7,'bandpass',420,260,0.06,0,6);this.tone(300,210,1.4,0.012,'square',0.1);this.noise(2.2,'lowpass',90,60,0.3,0,0.7);}
    else if(name==='thud'){this.tone(70,28,1.4,0.5,'sine',0);this.noise(1.2,'lowpass',400,60,0.5,0,0.7);}
    else if(name==='ignite'){this.noise(4.5,'bandpass',220,2600,0.16,0,0.9);this.tone(60,160,4.5,0.1,'sawtooth',0,null,2);}
    else if(name==='ring'){this.tone(80,26,2.4,0.7,'sine',0);this.noise(2.4,'lowpass',2500,120,0.4,0,0.6);}
    else if(name==='launch'){this.tone(90,24,2.6,0.8,'sine',0);this.noise(7,'bandpass',500,4200,0.4,0,0.5);this.noise(4,'lowpass',3000,200,0.45,0,0.6);}
  },
  music(from){
    if(!this.ac)return;const ac=this.ac;
    if(this.mus){const o=this.mus;o.gain.cancelScheduledValues(ac.currentTime);o.gain.setTargetAtTime(0,ac.currentTime,0.15);setTimeout(()=>{try{o.disconnect();}catch(e){}},1200);}

    const lpf=ac.createBiquadFilter();lpf.type='lowpass';lpf.frequency.value=3200;lpf.connect(out);

    const S=[];
    const note=(t,m,d,v,ty)=>S.push([t,fr(m),d,v,ty||'sine']);
    [[3.8,78],[5.3,81],[6.8,76],[8.6,74],[10.4,78],[11.9,71],[13.6,69]].forEach(n=>{note(n[0],n[1],4,0.05,'triangle');note(n[0],n[1]+12,3,0.015);});
    note(14.5,38,11,0.05,'triangle');note(14.5,45,11,0.035,'sine');note(21,50,6,0.03,'triangle');

    for(let k=0;k<40;k++){const c=ch[Math.floor(k/6)%4],t0=37+k*0.6;if(t0<49)note(t0,c[k%4]+12,1.6,0.028,'triangle');}
    const pr=[[62,66,69],[57,61,64],[59,62,66],[55,59,62]];
    for(let k=0;k<44;k++){const t0=49.4+k*0.25;if(t0>63)break;const c=pr[Math.floor((t0-49.4)/3.5)%4];note(t0,c[k%3]+12+(k%8>5?12:0),0.9,0.035,'triangle');}
    [[49.4,74,3.2],[52.9,78,3.4],[56.4,81,3.4],[59.9,86,5],[52.9,66,3],[56.4,69,3]].forEach(n=>{note(n[0],n[1],n[2],0.05,'triangle');note(n[0],n[1]-12,n[2],0.04,'sawtooth');});
    note(49.4,38,14,0.12,'sine');note(49.4,50,10,0.04,'sawtooth');

    for(const n of S){
      if(n[0]+n[2]<from)continue;
      const st=Math.max(0,n[0]-from),o=ac.createOscillator(),g=ac.createGain();
      o.type=n[4];o.frequency.value=n[1];
      const t0=base+st,dur=n[2]-(st===0?from-n[0]:0);
      if(dur<=0.05)continue;
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(n[3],t0+Math.min(dur*0.3,1.2));g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g);g.connect(lpf);o.start(t0);o.stop(t0+dur+0.1);
    }
  },
  setMute(m){this.muted=m;if(this.master)this.master.gain.value=m?0:0.9;}
};

/* ---------- loop / control ---------- */
let T=0,playing=false,paused=false,lastFrame=-1,lastTs=0,evDone=0;
function seek(tt){
  T=clamp(tt,0,END);resetSim();lastFrame=-1;
  evDone=0;while(evDone<EVENTS.length&&EVENTS[evDone][0]<T)evDone++;
  Aud.music(T);
  renderAt(T);
}
function renderAt(tm){
  const f=Math.floor(tm*24+1e-6);
  if(f===lastFrame)return;
  lastFrame=f;const t=f/24;
  try{advanceSim(t);}catch(e){if(!REPORTED.sim){REPORTED.sim=1;console.error('[sim]',e);}simTick=Math.floor(t*12+1e-6);}
  drawFrame(t);
  document.getElementById('barI').style.width=(100*t/END)+'%';
}
function tick(ts){
  requestAnimationFrame(tick);
  if(!playing)return;
  const dt=Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;
  if(paused)return;
  const prev=T;T=Math.min(END,T+dt);
  while(evDone<EVENTS.length&&EVENTS[evDone][0]<=T){if(EVENTS[evDone][0]>prev-0.2)Aud.ev(EVENTS[evDone][1]);evDone++;}
  renderAt(T);
}
function boot(){
  const st=document.getElementById('status'),go=document.getElementById('go');
  const steps=[['sky and clouds',paintSky],['distant forest',paintFar],['mid-distance trees',paintMidFar],['great trunks',paintMid],['canopy and vines',paintNear],['forest floor',paintGround],['foreground leaves',paintFront],['mist, grass, birds',()=>{paintSprites();initRobot();initTufts();initBirds();initGrass();}]];
  let i=0;
  const next=()=>{
    if(i>=steps.length){
      LAND=anchorW(computeRig(keyPose(0)),'shN',-34,-32);
      resetSim();st.textContent='ready';go.classList.remove('hidden');
      lastTs=performance.now();requestAnimationFrame(tick);
      const m=location.hash.match(/t=([\d.]+)/);
      if(m){T=parseFloat(m[1]);playing=true;document.getElementById('start').style.display='none';seek(T);}
      return;
    }
    st.textContent='painting: '+steps[i][0]+'…';
    setTimeout(()=>{steps[i][1]();i++;next();},30);
  };
  next();
}

  if(!playing)return;
  if(e.key==='ArrowRight')seek(T+5);else if(e.key==='ArrowLeft')seek(T-5);
  else if(e.key===' '){paused=!paused;e.preventDefault();if(Aud.ac){if(paused)Aud.ac.suspend();else Aud.ac.resume();}}
});
boot();
</script>
