<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜明けの守り手 — The Dawn Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:default}
  #title{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;z-index:4;font-family:'Shippori Mincho',serif}
  #title .jp{font-size:clamp(30px,6vh,66px);font-weight:600;color:#f7eed8;letter-spacing:.32em;padding-left:.32em;
    text-shadow:0 0 28px rgba(255,206,130,.42),0 2px 16px rgba(8,18,14,.65)}
  #title .rule{width:78px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,214,164,.8),transparent);margin:2.4vh auto 1.7vh}
  #title .en{font-family:'Zen Kaku Gothic New',sans-serif;font-size:clamp(9px,1.35vh,13px);letter-spacing:.62em;padding-left:.62em;color:#dccfa9;opacity:.92}
  #ui{position:fixed;left:0;right:0;bottom:0;height:var(--lb,64px);display:flex;align-items:center;gap:14px;padding:0 18px;box-sizing:border-box;z-index:6}
  #ui button{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:1px solid rgba(240,232,205,.32);background:rgba(12,18,15,.45);
    color:#e9dfc4;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .25s,border-color .25s}
  #ui button:hover{background:rgba(32,42,36,.62);border-color:rgba(240,232,205,.55)}
  #ui button svg{width:15px;height:15px;fill:currentColor}
  #bar{flex:1;height:26px;display:flex;align-items:center;cursor:pointer}
  #track{width:100%;height:3px;background:rgba(240,232,205,.15);border-radius:2px;position:relative;transition:height .18s}
  #bar:hover #track{height:6px}
  #prog{position:absolute;left:0;top:0;bottom:0;width:0;background:#e6c87a;border-radius:2px;box-shadow:0 0 9px rgba(230,200,122,.55)}
  #hint{position:fixed;right:20px;bottom:calc(var(--lb,64px) + 12px);z-index:5;font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:11px;letter-spacing:.12em;color:rgba(233,224,198,.55);pointer-events:none;opacity:0;text-shadow:0 1px 6px rgba(5,10,8,.8)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title">
  <div class="jp">夜明けの守り手</div>
  <div class="rule"></div>
  <div class="en">THE DAWN KEEPER</div>
</div>

<div id="hint">スペース — 停止 &nbsp;·&nbsp; S — 音 &nbsp;·&nbsp; 下の線ドラッグ — 映像移動</div>

<div id="ui">
  <button id="playBtn" title="play / pause">
    <svg id="icPause" viewBox="0 0 16 16"><path d="M3 1.5h3.4v13H3zM9.6 1.5H13v13H9.6z"/></svg>
    <svg id="icPlay" viewBox="0 0 16 16" style="display:none"><path d="M3.5 1.2 13.5 8l-10 6.8z"/></svg>
  </button>
  <button id="sndBtn" title="sound">
    <svg id="icSndOn" viewBox="0 0 16 16" style="display:none"><path d="M2 6v4h3l4 3.4V2.6L5 6H2zm9.3 2a3 3 0 0 0-1.8-2.8v5.6A3 3 0 0 0 11.3 8zm-1.8-5.6v1.3a5.5 5.5 0 0 1 0 8.6v1.3a7 7 0 0 0 0-11.2z"/></svg>
    <svg id="icSndOff" viewBox="0 0 16 16"><path d="M2 6v4h3l4 3.4V2.6L5 6H2zm12 0-2.5-2.5-1.2 1.2L12.8 6.2l-2.5 2.5 1.2 1.2 2.5-2.5 2.5 2.5 1.2-1.2-2.5-2.5 2.5-2.5-1.2-1.2L14 6z" transform="translate(-1.5 0) scale(.9)"/></svg>
  </button>
  <div id="bar"><div id="track"><div id="prog"></div></div></div>
</div>

<script>
(function(){
"use strict";
/* ================================================================
   夜明けの守り手 — a hand-drawn 2D anime sequence, pure canvas.
   Every frame is a deterministic function of scene time t (0..L),
   so any random frame can be inspected as a still.
   ================================================================ */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,k=1,u=1,lbH=64,dpr=1;
let t=0, playing=true, soundOn=false, lastT=0;
const L=52;

/* ---------------- utils ---------------- */
const clamp01=x=>x<0?0:x>1?1:x;
const smooth01=x=>{x=clamp01(x);return x*x*(3-2*x)};
const easeOutCubic=x=>1-Math.pow(1-clamp01(x),3);
const lerp=(a,b,x)=>a+(b-a)*x;
function h1(seed,i){const s=Math.sin(seed*127.1+i*311.7)*43758.5453;return (s-Math.floor(s))*2-1;}
function h0(seed,i){return (h1(seed,i)+1)/2;}
function hex2rgb(hx){const n=parseInt(hx.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function dk(hex,f){const r=hex2rgb(hex);return'rgb('+(r[0]*f|0)+','+(r[1]*f|0)+','+(r[2]*f|0)+')';}
function mkcv(w,h){const c=document.createElement('canvas');c.width=Math.max(2,w|0);c.height=Math.max(2,h|0);return c;}

/* wobbly ink path: quad-through-midpoints with per-vertex seeded wobble */
function wpath(c2,pts,seed,amp,close){
  const n=pts.length;
  const P=new Array(n);
  for(let i=0;i<n;i++)P[i]=[pts[i][0]+h1(seed,i*2+1)*amp,pts[i][1]+h1(seed,i*2+2)*amp];
  c2.beginPath();
  if(close){
    c2.moveTo((P[0][0]+P[n-1][0])/2,(P[0][1]+P[n-1][1])/2);
    for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];c2.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
    c2.closePath();
  }else{
    c2.moveTo(P[0][0],P[0][1]);
    for(let i=1;i<n-1;i++)c2.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2);
    c2.lineTo(P[n-1][0],P[n-1][1]);
  }
}
function bbox(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){if(p[0]<x0)x0=p[0];if(p[1]<y0)y0=p[1];if(p[0]>x1)x1=p[0];if(p[1]>y1)y1=p[1];}return{x:x0,y:y0,w:x1-x0,h:y1-y0};}
function circPts(x,y,r,n){n=n||12;const a=[];for(let i=0;i<n;i++){const a0=i/n*Math.PI*2-Math.PI/2;a.push([x+Math.cos(a0)*r,y+Math.sin(a0)*r]);}return a;}
function limbPts(x1,y1,x2,y2,w1,w2){const dx=x2-x1,dy=y2-y1,le=Math.hypot(dx,dy)||1,nx=-dy/le,ny=dx/le;
  return[[x1+nx*w1,y1+ny*w1],[x2+nx*w2,y2+ny*w2],[x2-nx*w2,y2-ny*w2],[x1-nx*w1,y1-ny*w1]];}
function rr(c2,x,y,w,h,r){c2.beginPath();c2.moveTo(x+r,y);c2.arcTo(x+w,y,x+w,y+h,r);c2.arcTo(x+w,y+h,x,y+h,r);c2.arcTo(x,y+h,x,y,r);c2.arcTo(x,y,x+w,y,r);c2.closePath();}
function bez(p0,p1,p2,p3,s){const u2=1-s;return[u2*u2*u2*p0[0]+3*u2*u2*s*p1[0]+3*u2*s*s*p2[0]+s*s*s*p3[0],
  u2*u2*u2*p0[1]+3*u2*u2*s*p1[1]+3*u2*s*s*p2[1]+s*s*s*p3[1]];}

/* ---------------- palette ---------------- */
const C={rust1:'#9c5a34',rust2:'#7c4326',moss1:'#6f8f4f',moss2:'#54763f',moss3:'#8aa65f'};
const PAL={
  steel :{b:'#8ea79c',sh:'#5e7a74',dp:'#435b57',line:'#26383a',rim:'#f4e3b2'},
  steelF:{b:dk('#8ea79c',.80),sh:dk('#5e7a74',.84),dp:dk('#435b57',.9),line:'#20312f',rim:dk('#f4e3b2',.72)},
  metal :{b:'#7d9099',sh:'#566a75',dp:'#3d4e58',line:'#23343c',rim:'#f0e0b6'},
  metalF:{b:dk('#7d9099',.80),sh:dk('#566a75',.84),dp:dk('#3d4e58',.9),line:'#1e2f37',rim:dk('#f0e0b6',.72)},
  darkP :{b:'#31474b',sh:'#22363a',dp:'#182a2d',line:'#1b2b2d',rim:'#e8d8ac'}
};

/* part: base fill -> hard cel shadow band -> weathering (clipped) -> ink line (double pass) */
function part(c2,pts,P,seed,amp,o){
  o=o||{};
  const lw=(o.lw!=null?o.lw:3.8)*k;
  wpath(c2,pts,seed,amp,true);
  c2.fillStyle=P.b;c2.fill();
  c2.save();wpath(c2,pts,seed,amp,true);c2.clip();
  const bb=bbox(pts);
  if(o.shadow==='v'){
    c2.fillStyle=P.sh;c2.fillRect(bb.x+bb.w*0.44,bb.y-4,bb.w+8,bb.h+8);
    c2.fillStyle=P.dp;c2.fillRect(bb.x+bb.w*0.74,bb.y-4,bb.w+8,bb.h+8);
  }else{
    c2.fillStyle=P.sh;c2.fillRect(bb.x-4,bb.y+bb.h*0.52,bb.w+8,bb.h+8);
    c2.fillStyle=P.dp;c2.fillRect(bb.x-4,bb.y+bb.h*0.78,bb.w+8,bb.h+8);
  }
  if(o.weather)o.weather(c2);
  c2.restore();
  c2.lineJoin='round';c2.lineCap='round';
  if(o.rim){
    wpath(c2,o.rim,seed+57,amp*0.7,false);
    c2.strokeStyle=P.rim;c2.globalAlpha=o.rimA!=null?o.rimA:0.72;c2.lineWidth=lw*0.7;c2.stroke();c2.globalAlpha=1;
  }
  wpath(c2,pts,seed,amp,true);
  c2.strokeStyle=P.line;c2.lineWidth=lw;c2.globalAlpha=0.92;c2.stroke();
  wpath(c2,pts,seed+77,amp*0.8,true);
  c2.globalAlpha=0.30;c2.lineWidth=lw*0.42;c2.stroke();c2.globalAlpha=1;
}
/* weathering helpers (px space) */
function rustC(c2,x,y,s,seed){const b=u*9*s;
  for(let i=0;i<4;i++){c2.fillStyle=i%2?C.rust2:C.rust1;c2.globalAlpha=.62;
    c2.beginPath();c2.arc(x+h0(seed,i*3+1)*b*1.6,y+h0(seed,i*3+2)*b,b*(.32+.4*h0(seed,i*3+3)),0,7);c2.fill();}
  c2.globalAlpha=1;}
function mossC(c2,x,y,s,seed){const b=u*7*s;
  for(let i=0;i<6;i++){c2.fillStyle=[C.moss1,C.moss2,C.moss3][i%3];c2.globalAlpha=.85;
    c2.beginPath();c2.arc(x+h0(seed,i*3+1)*b*1.8,y+h0(seed,i*3+2)*b*.8,b*(.28+.34*h0(seed,i*3+3)),0,7);c2.fill();}
  c2.globalAlpha=1;}
function chips(c2,x,y,s,seed){c2.fillStyle='#cfc9ab';
  for(let i=0;i<3;i++){c2.globalAlpha=.5;c2.fillRect(x+h0(seed,i*3)*8*s,y+h0(seed,i*3+1)*6*s,2.2*k,2.2*k);}
  c2.globalAlpha=1;}

/* ---------------- timeline ---------------- */
const RISE=[{t0:17.30,r:0.14},{t0:18.85,r:0.30},{t0:20.40,r:0.48},{t0:21.95,r:0.68},{t0:23.50,r:0.86},{t0:25.00,r:1.0}];
function coreGlow(t){
  if(t<11.4)return 0;
  let v;
  if(t<13.6)v=0.30+0.35*Math.abs(h1(3,Math.floor(t*6)));
  else if(t<27)v=0.30+0.10*Math.sin(t*2.1);
  else if(t<29)v=lerp(0.40,0.95,smooth01((t-27)/2));
  else v=1;
  for(const s of RISE){const d=t-(s.t0+0.2);if(d>0&&d<0.8)v+=0.10*Math.exp(-3*d);}
  return clamp01(v);
}
function eyeGlow(t){
  if(t<13.0)return 0;
  if(t<13.5)return (Math.floor(t*10)%2)?0.9:0.15;
  if(t<15)return 0.72+0.28*h1(7,Math.floor(t*8));
  if(t>=29)return 1;
  return 0.85;
}
function poseAt(t){
  let r=0,prev=0;
  for(const s of RISE)if(t>=s.t0){r=prev+(s.r-prev)*easeOutCubic((t-s.t0)/0.45);prev=s.r;}
  if(r>0){let ms=0;for(const s of RISE){const a=t-(s.t0+0.45);if(a>0&&a<1)ms+=0.006*Math.exp(-4*a)*Math.sin(a*15);}r=clamp01(r-ms);}
  const hr=smooth01((t-24.1)/2.5);
  const lift=smooth01((t-28.7)/0.9);
  const flame=(t<29)?0:clamp01((t-29)/0.2)*(1-smooth01((t-30.6)/0.6));
  const ld=(t<29)?0:1.55*H*Math.pow(clamp01((t-29)/0.95),2.6);
  return{r:r,hr:hr,lift:lift,core:coreGlow(t),eye:eyeGlow(t),flame:flame,ld:ld};
}
function tremorEnv(t){return(t>15.0&&t<16.8)?Math.pow(Math.sin(Math.PI*(t-15.0)/1.8),2):0;}
function launchEnv(t){return(t>28.95&&t<30.15)?Math.pow(Math.sin(Math.PI*(t-28.95)/1.2),2):0;}
function Wind(t){let w=0.12+0.9*tremorEnv(t);if(t>29)w+=2.3*Math.exp(-(t-29)*0.55);return w;}
function camAt(t){
  const s1=smooth01((t-29.8)/1.6),s2=smooth01((t-31.4)/5.6);
  const rise=1.55*H*(0.82*s1+0.18*s2);
  let sx=0,sy=0;
  /* slow hand-held drift during the quiet holds (camera breathing) */
  const calmA=1-smooth01((t-14.5)/2);                       // establishing shot
  const calmB=smooth01((t-36.5)/2)*(1-smooth01((t-46.5)/2)); // final sky hold
  const calm=Math.min(1,calmA+calmB);
  if(calm>0){sx+=4.5*k*Math.sin(t*0.19+1.3)*calm;sy+=7*k*Math.sin(t*0.15)*calm;}
  const tr=tremorEnv(t);if(tr>0){sx=h1(11,Math.floor(t*19))*3.2*k*tr;sy=h1(23,Math.floor(t*17))*2.6*k*tr;}
  const le=launchEnv(t);if(le>0){sx+=h1(31,Math.floor(t*31))*5.5*k*le;sy+=h1(43,Math.floor(t*29))*4.5*k*le;}
  return{x:sx,y:1.6*H-rise+sy};
}

/* ---------------- offscreens ---------------- */
let bg=null,vig=null,grainPat=null;
let leafS=[],grassS=[],grassW=120,grassH=90,mistS=null,puffS=null,rayS=null,branchL=null,branchR=null;

function buildSprites(){
  /* leaves: hand-painted little cel leaves */
  leafS=[];
  const cols=[['#d9a84f','#b9852f','#7a5518'],['#a3b464','#7a8f4a','#4c5f2c'],['#c8814c','#a55f35','#6d3a1c']];
  for(let v=0;v<3;v++){
    const s=mkcv(26,26),b=s.getContext('2d');
    b.translate(13,13);
    const pts=[[-11,0],[-4,-4.5],[5,-6],[11,0],[5,6],[-4,4.5]];
    wpath(b,pts,3+v,0.8,true);b.fillStyle=cols[v][0];b.fill();
    b.save();wpath(b,pts,3+v,0.8,true);b.clip();b.fillStyle=cols[v][1];b.fillRect(-12,0,24,12);b.restore();
    wpath(b,pts,3+v,0.8,true);b.strokeStyle=cols[v][2];b.lineWidth=1;b.globalAlpha=.8;b.stroke();
    b.beginPath();b.moveTo(-9,0);b.lineTo(9,0);b.stroke();b.globalAlpha=1;
    leafS.push(s);
  }
  /* grass tufts */
  grassS=[];
  const gcols=[['#24402f','#4a7a52'],['#3a5c44','#6d9a63']];
  for(let v=0;v<2;v++){
    const s=mkcv(grassW,grassH),b=s.getContext('2d');
    for(let i=0;i<9;i++){
      const bx=10+h0(50+v,i)*100,lean=(h0(60+v,i)-0.5)*46;
      b.strokeStyle=gcols[v][0];b.lineCap='round';
      b.lineWidth=4.5;b.beginPath();b.moveTo(bx,grassH);b.quadraticCurveTo(bx+lean*0.4,grassH*0.5,bx+lean,8+h0(70+v,i)*16);b.stroke();
      b.strokeStyle=gcols[v][1];b.lineWidth=1.6;b.globalAlpha=.7;
      b.beginPath();b.moveTo(bx+2.4,grassH);b.quadraticCurveTo(bx+2.4+lean*0.4,grassH*0.5,bx+2.4+lean,10+h0(70+v,i)*16);b.stroke();
      b.globalAlpha=1;
    }
    grassS.push(s);
  }
  /* mist blob */
  mistS=mkcv(360,150);{const b=mistS.getContext('2d');
    for(let i=0;i<3;i++){
      const x=90+i*90,y=75+h1(8,i)*20,r=120+i*20;
      const g=b.createRadialGradient(x,y,4,x,y,r);
      g.addColorStop(0,'rgba(250,242,224,0.55)');g.addColorStop(0.55,'rgba(248,240,222,0.22)');g.addColorStop(1,'rgba(248,240,222,0)');
      b.fillStyle=g;b.beginPath();b.ellipse(x,y,r*1.3,r*0.5,0,0,7);b.fill();
    }}
  /* dust puff */
  puffS=mkcv(128,128);{const b=puffS.getContext('2d');
    const g=b.createRadialGradient(64,64,4,64,64,62);
    g.addColorStop(0,'rgba(206,210,188,0.5)');g.addColorStop(0.6,'rgba(196,202,180,0.18)');g.addColorStop(1,'rgba(196,202,180,0)');
    b.fillStyle=g;b.fillRect(0,0,128,128);}
  /* god-ray beam */
  rayS=mkcv(110,560);{const b=rayS.getContext('2d');
    b.filter='blur(14px)';
    const g=b.createLinearGradient(0,0,0,560);
    g.addColorStop(0,'rgba(255,236,190,0.85)');g.addColorStop(0.7,'rgba(255,230,178,0.30)');g.addColorStop(1,'rgba(255,230,178,0)');
    b.fillStyle=g;
    b.beginPath();b.moveTo(34,0);b.lineTo(76,0);b.lineTo(96,560);b.lineTo(14,560);b.closePath();b.fill();
    b.filter='none';}
  /* bendable branch (left) */
  branchL=mkcv(Math.round(W*0.44),Math.round(H*0.20));{const b=branchL.getContext('2d');
    const bw=branchL.width,bh=branchL.height;
    b.strokeStyle='#3d4f43';b.lineCap='round';
    b.lineWidth=11*k;b.beginPath();b.moveTo(-6,bh*0.55);b.quadraticCurveTo(bw*0.3,bh*0.5,bw*0.78,bh*0.28);b.stroke();
    b.lineWidth=5*k;b.beginPath();b.moveTo(bw*0.32,bh*0.52);b.quadraticCurveTo(bw*0.44,bh*0.72,bw*0.52,bh*0.86);b.stroke();
    b.lineWidth=4*k;b.beginPath();b.moveTo(bw*0.6,bh*0.36);b.quadraticCurveTo(bw*0.7,bb2(bw,0.05),bw*0.72,bh*0.02);b.stroke();
    const cols=['#22392f','#2c4a3d','#26443a'];
    for(let i=0;i<10;i++){
      const bx=bw*(0.42+0.55*h0(120,i)),by=bh*(0.05+0.5*h0(121,i)),br=(0.10+0.13*h0(122,i))*bh*1.6;
      b.fillStyle=cols[i%3];b.beginPath();b.arc(bx,by,br,0,7);b.fill();
      b.fillStyle='rgba(111,156,111,0.4)';
      for(let j=0;j<3;j++){b.beginPath();b.arc(bx+h1(123,i*5+j)*br,by+h1(124,i*5+j)*br*0.7,br*0.16,0,7);b.fill();}
    }
  }
  branchR=mkcv(branchL.width,branchL.height);{const b=branchR.getContext('2d');b.scale(-1,1);b.drawImage(branchL,-branchL.width,0);}
}
function bb2(w,f){return w*f;}

/* ---------------- background world (pre-rendered, gouache style) ---------------- */
function crownRow(b,y,n,rMin,rMax,cols,seed,alpha){
  for(let i=0;i<n;i++){
    const x=((i+h0(seed,i)*0.6-0.3)*W/n);
    const r=(rMin+(rMax-rMin)*h0(seed,i+40))*H;
    b.fillStyle=cols[i%cols.length];b.globalAlpha=alpha;
    b.beginPath();b.arc(x,y-r*0.5,r,0,7);b.fill();
    b.globalAlpha=alpha*0.55;b.beginPath();b.arc(x+r*0.75,y-r*0.28,r*0.7,0,7);b.fill();
    b.globalAlpha=alpha*0.5;
    b.fillStyle='rgba(140,178,130,0.6)';

function drawMist(c2,t,front){

function leafDraw(c2,x,y,rot,sc,ty,al){
  if(al<=0)return;
  const s=26*k*sc;
  c2.globalAlpha=al;c2.save();c2.translate(x,y);c2.rotate(rot);
  c2.drawImage(leafS[ty],-s/2,-s/2,s,s);c2.restore();c2.globalAlpha=1;
}
function burstLeaves(c2,t,tg,n,sp,c0){
  for(let j=0;j<n;j++){
    const age=t-(tg+h0(tg*3+j,2)*0.5);
    if(age<=0||age>7)continue;
    const ang=h0(tg*3+j,3)*Math.PI*2,s=sp*(0.4+0.9*h0(tg*3+j,4));
    const x=c0[0]+Math.cos(ang)*s*age+26*k*Math.sin(age*2.4+h0(j,9)*6);
    const y=c0[1]+Math.sin(ang)*s*age*0.6+H*0.085*age*age;
    if(y>H*2.62)continue;
    leafDraw(c2,x,y,age*(2+h0(j,1)),0.5+0.6*h0(j,5),j%3,Math.min(1,(7-age)));
  }
}
function forestLeaves(c2,t){
  const per=1.7;
  for(let i=0;i<24;i++){
    const base=h0(i,7)*per,x0=(0.02+0.96*h0(i,3))*W,y0=H*(1.58+0.44*h0(i,5));
    const n=Math.floor((t-base)/per),sp=base+n*per,age=t-sp;
    if(age<0||age>11)continue;
    const v=H*(0.085+0.05*h0(i,6));
    const x=x0+24*k*Math.sin(age*(1.1+h0(i,8)*0.8)+h0(i,9)*6)+Wind(t)*16*k*age;
    const y=y0+v*age;
    if(y>H*2.55)continue;
    leafDraw(c2,x,y,age*(1.6+h0(i,2))+h0(i,4)*6,0.45+0.5*h0(i,1),i%3,Math.min(1,(11-age)/0.8)*0.9);
  }
  burstLeaves(c2,t,15.45,12,H*0.22,[W*0.35,H*1.72]);
  burstLeaves(c2,t,29.0,34,H*0.5,[W*0.55,H*2.02]);
}
function skyLeaves(c2,t){
  if(t<30.2)return;
  const per=0.85;
  for(let i=0;i<18;i++){
    const base=0.4+h0(i,40)*per;
    const n=Math.floor((t-30.2-base)/per);
    if(n<0)continue;
    const sp=30.2+base+n*per,age=t-sp;
    if(age>9)continue;
    const y0=H*(0.0+0.30*h0(i,5)),x0=(0.05+0.9*h0(i,3))*W;
    const v=H*(0.055+0.05*h0(i,6));
    const x=x0+30*k*Math.sin(age*1.2+h0(i,9)*6)+20*k*age*0.3;
    const y=y0+v*age;
    if(y>H*1.12)continue;
    leafDraw(c2,x,y,age*(1.4+h0(i,1)),0.4+0.5*h0(i,2),i%2,Math.min(1,(9-age)));
  }
}

const BURSTS=[{t:17.75,n:8},{t:19.30,n:8},{t:20.85,n:8},{t:22.40,n:9},{t:23.95,n:10},{t:25.45,n:12},{t:29.0,n:16}];
function drawChunks(c2,t){
  const cx=W*0.55,gy=H*2.30;
  for(const b0 of BURSTS){
    for(let j=0;j<b0.n;j++){
      const seed=b0.t*10+j;
      const age=t-b0.t;
      if(age<=0||age>0.8)continue;
      const side=h0(seed,1)>0.5?1:-1;
      const x0=cx+side*(150+120*h0(seed,2))*u;
      const y0=gy-8;
      const vx=side*(70+130*h0(seed,3))*k,vy=-(60+140*h0(seed,4))*k,g=700*k;
      const x=x0+vx*age,y=y0+vy*age+0.5*g*age*age;
      const sz=(4+h0(seed,5)*5)*k;
      c2.globalAlpha=Math.min(1,(0.8-age)/0.25);
      c2.save();c2.translate(x,y);c2.rotate(age*6+h0(seed,6)*6);
      c2.fillStyle='#5c4a38';
      c2.beginPath();c2.moveTo(-sz,0);c2.lineTo(0,-sz*0.8);c2.lineTo(sz,0);c2.lineTo(0,sz*0.7);c2.closePath();c2.fill();
      c2.restore();c2.globalAlpha=1;
    }
    const age=t-b0.t;
    if(age>0&&age<0.6){
      for(let j=0;j<4;j++){
        const px=cx+(h0(b0.t*7+j,8)-0.5)*520*u,py=gy-30-k*age*40;
        const s=(30+90*age)*k;
        c2.globalAlpha=0.30*(1-age/0.6);

}

/* vines that cling to the kneeling form and tear loose */
function drawVines(c2,t){
  const P=poseAt(t),cx=W*0.55,gy=H*2.30;
  const pt=function(x,y){return[cx+x*u,gy+y*u];};
  const r=P.r,hr=P.hr;
  const shY=-470-170*r,shX=218+18*r,kneeX=175+20*r,kneeY=-65-165*r,topY=-505-160*r;
  const vines=[
    {x:-shX-12,y:shY-70,len:130,td:17.75,sd:1},
    {x:82,y:topY+52,len:95,td:19.30,sd:2},
    {x:-kneeX-14,y:kneeY-16,len:110,td:20.85,sd:3}
  ];
  for(const v of vines){
    let age=-1;
    if(t>v.td)age=t-v.td;
    if(age>1.6)continue;
    const ax=pt(v.x,v.y);
    const fall=age<0?0:age*age*760*k;
    const rot=age<0?0:0.35*age;
    const al=age<0?1:1-age/1.6;
    c2.save();c2.translate(ax[0],ax[1]+fall);c2.rotate(rot);c2.globalAlpha=al;
    wpath(c2,[[0,0],[-14*u,v.len*0.55*u],[12*u,v.len*u]],500+v.sd,1.2*k,false);
    c2.strokeStyle=C.moss2;c2.lineWidth=2.6*k;c2.lineCap='round';c2.stroke();
    for(let i=1;i<=4;i++){
      const q=i/5;
      c2.fillStyle=i%2?C.moss1:C.moss3;
      c2.beginPath();c2.arc(-14*u*q+26*u*q*q,v.len*u*q*0.9,2.6*k*(1-q*0.4),0,7);c2.fill();
    }
    c2.beginPath();c2.ellipse(12*u,v.len*u+4*k,5*k,3*k,0.5,0,7);c2.fillStyle=C.moss1;c2.fill();
    c2.restore();c2.globalAlpha=1;
  }
}

/* ---------------- light streak across the sky ---------------- */
function quadPt(p0,p1,p2,q){
  const u2=1-q;
  return[u2*u2*p0[0]+2*u2*q*p1[0]+q*q*p2[0],u2*u2*p0[1]+2*u2*q*p1[1]+q*q*p2[1]];
}
function drawStreak(c2,t){
  const s=easeOutCubic(clamp01((t-29.9)/3.3));
  const fade=1-smooth01((t-38.5)/3);
  if(s<=0.001||fade<=0)return;
  const P0=[W*0.55,H*1.70],P1=[W*0.42,H*0.92],P2=[W*0.335,H*0.48];
  const N=36,pts=[];
  for(let i=0;i<=N;i++){const q=i/N*s;pts.push(quadPt(P0,P1,P2,q));}
  c2.globalCompositeOperation='lighter';
  c2.lineCap='round';c2.lineJoin='round';
  c2.beginPath();c2.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)c2.lineTo(pts[i][0],pts[i][1]);
  c2.strokeStyle='rgba(246,233,216,'+(0.06*fade)+')';c2.lineWidth=64*k;c2.stroke();
  c2.strokeStyle='rgba(255,217,143,'+(0.16*fade)+')';c2.lineWidth=26*k;c2.stroke();
  c2.strokeStyle='rgba(255,233,190,'+(0.42*fade)+')';c2.lineWidth=10*k;c2.stroke();
  c2.strokeStyle='rgba(255,253,244,'+(0.85*fade)+')';c2.lineWidth=3.2*k;c2.stroke();
  const tip=pts[pts.length-1];
  if(s<0.999){
    c2.globalCompositeOperation='screen';
    const g=c2.createRadialGradient(tip[0],tip[1],2,tip[0],tip[1],70*k);
    g.addColorStop(0,'rgba(255,244,214,'+(0.8*fade)+')');g.addColorStop(1,'rgba(255,244,214,0)');
    c2.fillStyle=g;c2.beginPath();c2.arc(tip[0],tip[1],70*k,0,7);c2.fill();
    /* tiny mecha silhouette riding the light */
    c2.globalAlpha=0.8*fade;
    c2.save();c2.translate(tip[0],tip[1]);c2.scale(k,k);
    c2.fillStyle='#2c3a38';
    c2.beginPath();c2.ellipse(0,2,5,9,0,0,7);c2.fill();
    c2.beginPath();c2.arc(0,-9,4,0,7);c2.fill();
    c2.fillStyle='#ffcf7a';c2.beginPath();c2.arc(0,0,1.8,0,7);c2.fill();
    c2.restore();c2.globalAlpha=1;
  }else{
    const pu=0.25+0.3*Math.abs(Math.sin(t*2.4));
    c2.globalCompositeOperation='screen';
    const g=c2.createRadialGradient(tip[0],tip[1],2,tip[0],tip[1],56*k);
    g.addColorStop(0,'rgba(255,244,214,'+pu*fade+')');g.addColorStop(1,'rgba(255,244,214,0)');
    c2.fillStyle=g;c2.beginPath();c2.arc(tip[0],tip[1],56*k,0,7);c2.fill();
  }
  c2.globalCompositeOperation='source-over';
}

/* ---------------- screen finish ---------------- */
function screenFinish(c2,t,cam){
  /* sun bloom (+ reaction pulse when the light reaches it) */
  const sunX=W*0.32,sunY=H*0.46-cam.y;
  const sunPulse=smooth01((t-33)/2)*(1-smooth01((t-41)/2));
  if(sunY>-H&&sunY<2*H){
    c2.globalCompositeOperation='screen';
    const g=c2.createRadialGradient(sunX,sunY,2,sunX,sunY,H*0.55);
    g.addColorStop(0,'rgba(255,244,218,'+(0.30+0.05*Math.sin(t*0.5)+0.14*sunPulse)+')');
    g.addColorStop(0.5,'rgba(255,224,170,'+(0.10+0.08*sunPulse)+')');g.addColorStop(1,'rgba(255,224,170,0)');
    c2.fillStyle=g;c2.fillRect(0,0,W,H);
    c2.globalCompositeOperation='source-over';
  }
  /* dawn wash from the left — swells as first light touches the forest */
  c2.globalCompositeOperation='screen';
  const g2=c2.createLinearGradient(0,0,W*0.8,0);
  const dawnBump=0.09*Math.sin(Math.PI*clamp01((t-10.5)/5.5));
  g2.addColorStop(0,'rgba(255,205,140,'+(0.04+dawnBump)+')');g2.addColorStop(1,'rgba(255,205,140,0)');
  c2.fillStyle=g2;c2.fillRect(0,0,W,H);
  c2.globalCompositeOperation='source-over';
  /* canopy-swoosh speed streaks */
  if(t>29.8&&t<31.4){
    const ph=clamp01((t-29.8)/1.6),a=0.10*Math.sin(Math.PI*ph);
    c2.globalCompositeOperation='screen';
    c2.strokeStyle='rgba(255,250,238,'+a+')';c2.lineWidth=2.4*k;
    for(let i=0;i<10;i++){
      const x=h0(210,i)*W;
      c2.beginPath();c2.moveTo(x,0);c2.lineTo(x+40*k,H);c2.stroke();
    }
    c2.globalCompositeOperation='source-over';
  }
  /* grain + vignette */
  c2.globalCompositeOperation='overlay';
  c2.globalAlpha=0.5;c2.fillStyle=grainPat;c2.fillRect(0,0,W,H);
  c2.globalAlpha=1;c2.globalCompositeOperation='source-over';
  c2.drawImage(vig,0,0,W,H);
  /* letterbox */
  c2.fillStyle='#05070a';
  c2.fillRect(0,0,W,lbH);c2.fillRect(0,H-lbH,W,lbH);
  c2.fillStyle='rgba(230,200,140,0.12)';
  c2.fillRect(0,lbH-1,W,1);c2.fillRect(0,H-lbH,W,1);
  /* fades (loop in / out through warm dawn bloom) */
  let fa=0;
  if(t<1.2)fa=1-t/1.2;
  if(t>48)fa=Math.max(fa,smooth01((t-48)/4));
  if(fa>0){c2.fillStyle='rgba(246,231,200,'+fa.toFixed(3)+')';c2.fillRect(0,0,W,H);}
}

/* ---------------- master render ---------------- */
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a1210';ctx.fillRect(0,0,W,H);
  const cam=camAt(t);
  ctx.save();
  ctx.translate(cam.x,-cam.y);
  ctx.drawImage(bg,0,0,W,H*2.6);
  drawMist(ctx,t,false);
  drawBranches(ctx,t);
  forestLeaves(ctx,t);
  drawRobot(ctx,t);
  drawVines(ctx,t);
  drawChunks(ctx,t);
  drawHeroBird(ctx,t);
  drawFlock(ctx,t);
  drawRays(ctx,t);
  drawPollen(ctx,t);
  drawMist(ctx,t,true);
  drawGrassRow(ctx,t);
  drawStreak(ctx,t);
  skyLeaves(ctx,t);
  drawSkyBirds(ctx,t);
  ctx.restore();
  screenFinish(ctx,t,cam);
}

/* ---------------- audio (subtle, user-toggleable) ---------------- */
let AC=null,master=null,windG=null,humG=null,noiseBuf=null,evIdx=0;
function initAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=0.75;master.connect(AC.destination);
  const len=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const ws=AC.createBufferSource();ws.buffer=noiseBuf;ws.loop=true;
  const wf=AC.createBiquadFilter();wf.type='lowpass';wf.frequency.value=320;
  windG=AC.createGain();windG.gain.value=0;
  ws.connect(wf);wf.connect(windG);windG.connect(master);ws.start();
  const lfo=AC.createOscillator();lfo.frequency.value=0.07;
  const lg=AC.createGain();lg.gain.value=120;lfo.connect(lg);lg.connect(wf.frequency);lfo.start();
  humG=AC.createGain();humG.gain.value=0;
  const hf=AC.createBiquadFilter();hf.type='lowpass';hf.frequency.value=240;
  humG.connect(hf);hf.connect(master);
  [55,82.5,110].forEach(function(f,i){
    const o=AC.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=(i-1)*4;
    const g=AC.createGain();g.gain.value=i===0?0.5:0.22;
    o.connect(g);g.connect(humG);o.start();
  });
}
function nsrc(){const s=AC.createBufferSource();s.buffer=noiseBuf;return s;}
function envG(peak,a,d,at){const t0=AC.currentTime+(at||0);const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(peak,t0+a);
  g.gain.exponentialRampToValueAtTime(0.0008,t0+a+d);return g;}
function chirpS(f){if(!AC)return;const t0=AC.currentTime;const o=AC.createOscillator();o.type='sine';
  const g=envG(0.09,0.03,0.18);
  o.frequency.setValueAtTime(f,t0);o.frequency.linearRampToValueAtTime(f*1.35,t0+0.09);
  o.frequency.linearRampToValueAtTime(f*0.92,t0+0.22);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.32);}
function creakS(){if(!AC)return;const n=nsrc();const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=5;
  const t0=AC.currentTime;bp.frequency.setValueAtTime(200,t0);bp.frequency.exponentialRampToValueAtTime(70,t0+0.5);
  const g=envG(0.14,0.05,0.5);n.connect(bp);bp.connect(g);g.connect(master);n.start();n.stop(t0+0.7);}
function thumpS(f,pk,d){if(!AC)return;const t0=AC.currentTime;const o=AC.createOscillator();o.type='sine';
  const g=envG(pk,0.02,d);
  o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f*0.55),t0+d);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+0.1);}
function whooshS(){if(!AC)return;const n=nsrc();const lp=AC.createBiquadFilter();lp.type='lowpass';
  const t0=AC.currentTime;lp.frequency.setValueAtTime(220,t0);lp.frequency.exponentialRampToValueAtTime(3600,t0+1.1);
  const g=envG(0.35,0.12,1.1);n.connect(lp);lp.connect(g);g.connect(master);n.start();n.stop(t0+1.4);}
function chimeS(){if(!AC)return;const t0=AC.currentTime;
  [1046,1568].forEach(function(f,i){
    const o=AC.createOscillator();o.type='sine';o.frequency.value=f;
    const g=envG(0.05,0.05,1.4,i*0.08);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+1.6);});}
function flutterS(){if(!AC)return;const n=nsrc();const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;
  const g=envG(0.04,0.03,0.35);n.connect(hp);hp.connect(g);g.connect(master);n.start();n.stop(AC.currentTime+0.4);}
function spoolS(){if(!AC)return;const t0=AC.currentTime;const o=AC.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(80,t0);o.frequency.exponentialRampToValueAtTime(400,t0+0.8);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
  const g=envG(0.09,0.1,0.8);o.connect(lp);lp.connect(g);g.connect(master);o.start(t0);o.stop(t0+1);}
function rumbleS(){if(!AC)return;thumpS(34,0.28,1.5);
  const n=nsrc();const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=110;
  const g=envG(0.16,0.1,1.4);n.connect(lp);lp.connect(g);g.connect(master);n.start();n.stop(AC.currentTime+1.6);}
const EV=[
  [3.6,function(){chirpS(2300);}],
  [5.3,function(){chirpS(2650);}],
  [7.0,function(){chirpS(2100);}],
  [9.3,function(){flutterS();}],
  [10.75,function(){thumpS(120,0.15,0.12);}],
  [13.15,function(){chimeS();}],
  [15.0,function(){rumbleS();}],
  [15.55,function(){chirpS(2900);flutterS();}],
  [17.45,function(){creakS();thumpS(45,0.22,0.35);}],
  [18.95,function(){creakS();thumpS(42,0.24,0.38);}],
  [20.50,function(){creakS();thumpS(40,0.26,0.4);}],
  [22.05,function(){creakS();thumpS(38,0.28,0.42);}],
  [23.60,function(){creakS();thumpS(36,0.3,0.45);}],
  [25.10,function(){creakS();thumpS(34,0.32,0.5);}],
  [28.35,function(){spoolS();}],
  [29.0,function(){whooshS();thumpS(30,0.5,0.9);}],
  [44.5,function(){chirpS(1900);}]
].sort(function(a,b){return a[0]-b[0];});
function audioTick(){
  if(!AC||!soundOn)return;
  const now=AC.currentTime;
  if(playing){
    for(let i=evIdx;i<EV.length;i++){
      if(EV[i][0]<=t&&EV[i][0]>lastT){EV[i][1]();evIdx++;}
      else if(EV[i][0]>t)break;
    }
  }
  windG.gain.setTargetAtTime(0.03+0.11*Math.min(1.3,Wind(t)),now,0.4);
  let hl=0;
  if(t>=12&&t<17)hl=0.06*(t-12)/5;
  else if(t>=17&&t<27)hl=0.07;
  else if(t>=27&&t<29)hl=0.07+0.06*((t-27)/2);
  else if(t>=29&&t<30.5)hl=0.12;
  humG.gain.setTargetAtTime(hl,now,0.5);
}

  evIdx=0;
}
barEl.addEventListener('pointerdown',function(e){e.stopPropagation();scrubbing=true;scrubTo(e.clientX);barEl.setPointerCapture(e.pointerId);});
barEl.addEventListener('pointermove',function(e){if(scrubbing)scrubTo(e.clientX);});
barEl.addEventListener('pointerup',function(){scrubbing=false;});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}
  else if(e.key==='s'||e.key==='S')setSound(!soundOn);
  else if(e.key==='r'||e.key==='R'){t=0;evIdx=0;}
});
function titleOp(t2){return Math.min(smooth01((t2-1.1)/1.3),1-smooth01((t2-5.8)/1.4));}
function hintOp(t2){return Math.min(smooth01((t2-0.7)/0.8),1-smooth01((t2-4.2)/1.2));}

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(1.5,window.devicePixelRatio||1);
  cv.width=(W*dpr)|0;cv.height=(H*dpr)|0;
  k=H/1080;u=H/1350;lbH=Math.round(H*0.078);
  document.documentElement.style.setProperty('--lb',lbH+'px');
  buildSprites();buildBG();buildVignette();
}
let rzT=null;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resize,140);});
resize();
setSound(false);setPlaying(true);

let lastNow=performance.now();
function frame(now){
  let dt=(now-lastNow)/1000;lastNow=now;
  if(dt>0.05)dt=0.05;
  if(playing&&!scrubbing){
    const nt=t+dt;
    if(nt>=L){nt-=L;evIdx=0;}
    lastT=t;t=nt;
  }
  render();
  audioTick();
  progEl.style.width=(t/L*100).toFixed(2)+'%';
  titleEl.style.opacity=titleOp(t).toFixed(3);
  hintEl.style.opacity=hintOp(t).toFixed(3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
